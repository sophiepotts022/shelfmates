<!doctype html><html><head><meta name="theme-color" content="#edf0e9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Shelfmates"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shelfmates</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Borrow and lend books with your friends.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@1,600&family=Courier+Prime:wght@700&family=Figtree:wght@400;500;600;700;800&family=Young+Serif&display=swap">
<style>
/* Shelfmates prototype: design tokens, device frame and shared components. */

/* Layout: one phone-sized app. On wide screens it sits in a device frame beside the prototype notes;
   on a phone it fills the screen. Palette: a library reading room, green lamp, brass and oxblood leather. */
:root {
  --paper: #edf0e9;        /* app background, pale ledger green */
  --card: #fbfcf8;
  --sunk: #e1e7de;         /* search fields, quiet fills */
  --ink: #17231d;
  --ink-2: #536059;
  --ink-3: #78837c;
  --line: #d0d8cd;
  --green: #1f5a41;        /* primary actions, selected tab, available */
  --on-green: #ffffff;
  --green-soft: #d5e6da;
  --brass: #a8761f;        /* stars, demo controls */
  --brass-ink: #765210;    /* pending text on brass-soft */
  --brass-soft: #f1e3c4;
  --oxblood: #8e3a3a;      /* borrowed, due dates, badges */
  --oxblood-soft: #f2dcd8;
  --muted-soft: #e3e6e1;
  --slip: #f6efdc;         /* library checkout card */
  --slip-line: #e2d5b3;
  --stage: #d7ddd3;        /* the desk behind the phone */
  --stage-ink: #25332b;
  --bezel: #121714;
  --toast-act: #a6dcbd;
  --map-land: #e3e8db;
  --map-park: #c6dbbd;
  --map-water: #a7c9d5;
  --map-road: #fbfcf8;
  --map-minor: #d3dacb;
  --shadow: 0 1px 2px rgba(23, 35, 29, .06), 0 6px 16px -8px rgba(23, 35, 29, .24);

  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-stamp: "Courier Prime", "Courier New", ui-monospace, monospace;

  --gl: max(20px, env(safe-area-inset-left, 0px));
  --gr: max(20px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111915; --card: #1a241f; --sunk: #232f29; --ink: #e7ede8; --ink-2: #a8b4ac; --ink-3: #818d85; --line: #2f3c35;
    --green: #74c49a; --on-green: #0d1a13; --green-soft: #1f3a2d; --brass: #dcb060; --brass-ink: #e8c37c; --brass-soft: #3a3020;
    --oxblood: #e48f86; --oxblood-soft: #3f2422; --muted-soft: #27312c; --slip: #2a2619; --slip-line: #433b26;
    --stage: #0a0f0c; --stage-ink: #cdd7d0; --bezel: #000; --toast-act: #1f5a41;
    --map-land: #1a241f; --map-park: #22382b; --map-water: #1e3945; --map-road: #2d3a33; --map-minor: #222d27;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 20px -10px rgba(0, 0, 0, .65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111915; --card: #1a241f; --sunk: #232f29; --ink: #e7ede8; --ink-2: #a8b4ac; --ink-3: #818d85; --line: #2f3c35;
  --green: #74c49a; --on-green: #0d1a13; --green-soft: #1f3a2d; --brass: #dcb060; --brass-ink: #e8c37c; --brass-soft: #3a3020;
  --oxblood: #e48f86; --oxblood-soft: #3f2422; --muted-soft: #27312c; --slip: #2a2619; --slip-line: #433b26;
  --stage: #0a0f0c; --stage-ink: #cdd7d0; --bezel: #000; --toast-act: #1f5a41;
  --map-land: #1a241f; --map-park: #22382b; --map-water: #1e3945; --map-road: #2d3a33; --map-minor: #222d27;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 20px -10px rgba(0, 0, 0, .65);
  color-scheme: dark;
}

html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--stage); color: var(--ink);
  font: 400 15px/1.4 var(--font-ui);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; }
:focus-visible { outline: 2.5px solid var(--green); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-2); }
.small { font-size: 12.5px; }

/* ---------- Stage and device frame ---------- */
.stage {
  height: 100%; display: flex; align-items: center; justify-content: center; gap: 56px;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.device {
  position: relative; flex: none; width: 392px; height: min(852px, 100%);
  padding: 12px; border-radius: 58px; background: var(--bezel);
  box-shadow: 0 0 0 1.5px #2c3430, inset 0 0 0 2px #2a302c, 0 34px 70px -24px rgba(10, 20, 15, .6);
}
.device-screen {
  position: relative; height: 100%; overflow: hidden; isolation: isolate;
  border-radius: 46px; background: var(--paper);
  display: flex; flex-direction: column;
}
.device-screen::after {
  content: ""; position: absolute; left: 50%; bottom: 7px; z-index: 40; width: 128px; height: 5px;
  border-radius: 3px; background: var(--ink); opacity: .8; transform: translateX(-50%); pointer-events: none;
}
.statusbar {
  position: relative; flex: none; height: 50px; display: flex; align-items: center; justify-content: space-between;
  padding: 8px 30px 0 38px; font: 600 15px var(--font-ui); color: var(--ink); font-variant-numeric: tabular-nums;
}
.island { position: absolute; left: 50%; top: 11px; width: 116px; height: 33px; border-radius: 20px; background: #000; transform: translateX(-50%); }
.sb-icons { display: flex; align-items: center; gap: 6px; }
.sb-icons svg { height: 11.5px; width: auto; fill: currentColor; }
.app { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.screen { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 28px; display: flex; flex-direction: column; scrollbar-width: none; }
.body::-webkit-scrollbar { display: none; }
.pad { padding-left: var(--gl); padding-right: var(--gr); }

@media (max-width: 1000px) { .notes { display: none; } }
@media (max-width: 520px) {
  .stage { padding: 0; }
  .device { width: 100%; height: 100%; padding: 0; border-radius: 0; background: none; box-shadow: none; }
  .device-screen { border-radius: 0; }
  .statusbar, .device-screen::after { display: none; }
}

/* ---------- Icons, logo ---------- */
.ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic.muted { width: 18px; height: 18px; color: var(--ink-3); }
.ic.inline { width: 15px; height: 15px; vertical-align: -2px; }
.logo { width: 28px; height: 28px; flex: none; }
.lg1 { fill: var(--green); } .lg2 { fill: var(--brass); } .lg3 { fill: var(--oxblood); }
.lg4 { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }

/* ---------- Book covers (drawn in code) ---------- */
.cover {
  position: relative; display: block; width: 100%; max-width: 100%; aspect-ratio: 2 / 3;
  container-type: inline-size; overflow: hidden; isolation: isolate;
  border-radius: 3px 7px 7px 3px; color: var(--cf);
  background: linear-gradient(165deg, var(--cb), var(--cb2));
  box-shadow: 0 1px 2px rgba(0, 0, 0, .2), 0 8px 16px -8px rgba(15, 25, 20, .5);
}
.cover::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, rgba(0, 0, 0, .3) 0, rgba(255, 255, 255, .2) 2.5%, rgba(0, 0, 0, .06) 6%, transparent 9%),
              linear-gradient(180deg, rgba(255, 255, 255, .08), transparent 30%);
}
.cover-art { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; }
.cover-art .a { fill: var(--ca); }
.cover-art .as { fill: none; stroke: var(--ca); stroke-linecap: round; stroke-linejoin: round; }
.cover-art .f { fill: var(--cf); }
.cover-art .fs { fill: none; stroke: var(--cf); stroke-linecap: round; stroke-linejoin: round; }
.l-mid .cover-art { opacity: .55; }
.cover-title {
  position: absolute; left: 11%; right: 8%; top: 9%;
  font-size: 14cqw; line-height: 1.04; overflow-wrap: break-word; hyphens: auto;
}
.cover-author {
  position: absolute; left: 11%; right: 8%; bottom: 6.5%;
  font: 700 6.6cqw/1.1 var(--font-ui); letter-spacing: .09em; text-transform: uppercase; opacity: .85;
}
.l-mid .cover-title { top: 50%; transform: translateY(-50%); text-align: center; left: 8%; }
.l-mid .cover-author { text-align: center; left: 8%; }
.l-bottom .cover-title { top: auto; bottom: 17%; }
.l-stack .cover-title { font-size: 19cqw; line-height: .95; }
.f-serif { font-family: var(--font-display); }
.f-bebas { font-family: "Bebas Neue", Impact, "Arial Narrow", sans-serif; font-size: 19cqw; line-height: .92; letter-spacing: .02em; }
.l-stack .f-bebas { font-size: 25cqw; }
.f-garamond { font-family: "Cormorant Garamond", Garamond, Georgia, serif; font-style: italic; font-weight: 600; font-size: 17cqw; line-height: .95; }
.f-sans { font-family: var(--font-ui); font-weight: 800; letter-spacing: -.02em; }
.t-long .cover-title { font-size: 11.5cqw; }
.t-long .f-bebas { font-size: 15.5cqw; }
.t-long .f-garamond { font-size: 14cqw; }
@container (max-width: 58px) { .cover-author { display: none; } }
.cover.xs { width: 42px; flex: none; }

/* ---------- Avatars ---------- */
.av {
  --s: 40px; width: var(--s); height: var(--s); flex: none; border-radius: 50%;
  display: inline-grid; place-items: center; background: var(--av); color: #fff;
  font: 700 calc(var(--s) * .36)/1 var(--font-ui); letter-spacing: .02em;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16);
}
.av-stack { position: relative; flex: none; width: var(--s); height: var(--s); }
.av-stack .av { position: absolute; box-shadow: 0 0 0 2px var(--card); }
.av-stack.n1 .av { inset: 0; margin: auto; }
.av-stack.n2 .av:nth-child(1) { left: 0; top: 0; }
.av-stack.n2 .av:nth-child(2) { right: 0; bottom: 0; }
.av-stack.n3 .av:nth-child(1) { left: 0; top: 4%; }
.av-stack.n3 .av:nth-child(2) { right: 0; top: 0; }
.av-stack.n3 .av:nth-child(3) { left: 22%; bottom: 0; }

/* ---------- Stars ---------- */
.stars { display: inline-flex; align-items: center; gap: 1px; color: var(--brass); }
.star { position: relative; display: inline-grid; place-items: center; width: var(--ss); height: var(--ss); padding: 0; border: 0; background: none; color: inherit; }
.star .ic { width: 100%; height: 100%; stroke-width: 1.6; }
.star.on .ic { fill: currentColor; }
.star:not(.on):not(.half) { color: var(--ink-3); opacity: .55; }
.star .half-fill { position: absolute; inset: 0; fill: currentColor; clip-path: inset(0 50% 0 0); }
.stars.rate { margin-left: -4px; }
.stars.rate .star { width: calc(var(--ss) + 10px); height: calc(var(--ss) + 10px); padding: 5px; cursor: pointer; border-radius: 8px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid transparent;
  font: 700 15px var(--font-ui); white-space: nowrap; cursor: pointer; text-decoration: none;
  transition: transform .12s, background-color .2s;
}
.btn:active:not(:disabled) { transform: scale(.97); }
.btn .ic { width: 18px; height: 18px; }
.btn.primary { background: var(--green); color: var(--on-green); }
.btn.soft { background: var(--green-soft); color: var(--green); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.static { cursor: default; }
.btn.static:active { transform: none; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btn.xs { min-height: 30px; padding: 0 11px; font-size: 13px; gap: 5px; }
.btn.xs .ic { width: 15px; height: 15px; }
.btn.full { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.icon-btn { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
.icon-btn.solid { background: var(--green); color: var(--on-green); }
.icon-btn.ghost { visibility: hidden; }
.link { background: none; border: 0; padding: 6px 0; color: var(--green); font: 700 14px var(--font-ui); cursor: pointer; }
.link.danger { color: var(--oxblood); }
.link.small { font-size: 12.5px; padding: 4px 0; }
.text-link { background: none; border: 0; padding: 0; color: var(--green); font: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; text-align: left; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btn-row.center { justify-content: center; }

/* ---------- Pills, chips, tags, stamps ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; flex: none; height: 36px; padding: 0 14px;
  border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
  font: 600 14px var(--font-ui); white-space: nowrap; cursor: pointer;
}
.pill .ic { width: 16px; height: 16px; stroke-width: 2.2; }
.pill.on, .pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.pill.dashed { border-style: dashed; color: var(--ink-2); background: transparent; }
.pill.sm { height: 30px; padding: 0 12px; font-size: 13px; }
/* Copy chips: square-cornered, filled. They describe a physical copy. */
.chip {
  display: inline-flex; align-items: center; gap: 5px; max-width: 100%; height: 24px; padding: 0 9px;
  border-radius: 6px; font: 700 12px var(--font-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chip .ic { width: 14px; height: 14px; stroke-width: 2.2; }
.chip .dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: currentColor; }
.st-available { background: var(--green-soft); color: var(--green); }
.st-pending { background: var(--brass-soft); color: var(--brass-ink); }
.st-borrowed { background: var(--oxblood-soft); color: var(--oxblood); }
.st-unavailable { background: var(--muted-soft); color: var(--ink-2); }
/* Reading chips: round and outlined. They describe your own reading list. */
.chip.rd { border-radius: 999px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink-2); }
.chip.fav { padding: 0 7px; border-radius: 999px; background: var(--oxblood-soft); color: var(--oxblood); }
.chip.fav .ic { fill: currentColor; }
.tag { display: inline-block; padding: 3px 6px; border-radius: 4px; background: var(--green-soft); color: var(--green); font: 700 10.5px/1 var(--font-ui); letter-spacing: .06em; text-transform: uppercase; vertical-align: 2px; }
/* The library date-due stamp */
.stamp {
  display: inline-block; flex: none; padding: 4px 6px 3px; border: 1.5px solid currentColor; border-radius: 3px;
  background: var(--card); color: var(--oxblood); transform: rotate(-4deg);
  font: 700 11px/1 var(--font-stamp); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
}

/* ---------- Fields ---------- */
.search {
  display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 8px 0 14px;
  border-radius: 14px; background: var(--sunk); color: var(--ink-2);
}
.search:focus-within { box-shadow: 0 0 0 2px var(--green); }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; color: var(--ink); font: 500 16px var(--font-ui); }
.search input::placeholder { color: var(--ink-3); }
.search input::-webkit-search-cancel-button { display: none; }
.search .clear { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--line); color: var(--ink); cursor: pointer; }
.search .clear .ic { width: 15px; height: 15px; }
textarea, .input {
  width: 100%; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line);
  background: var(--paper); color: var(--ink); font: 500 16px/1.4 var(--font-ui); resize: none;
}
textarea:focus, .input:focus { outline: none; border-color: var(--green); }
.field-label { display: block; margin: 18px 0 8px; font: 700 12px var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opts.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opt {
  min-height: 44px; padding: 0 10px; display: flex; align-items: center; justify-content: center; gap: 6px;
  border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
  font: 600 14px var(--font-ui); cursor: pointer; text-align: center;
}
.opt .ic { width: 17px; height: 17px; }
.opt[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--on-green); }
.opt.fav[aria-pressed="true"] { background: var(--oxblood-soft); border-color: var(--oxblood); color: var(--oxblood); }
.opt.fav[aria-pressed="true"] .ic { fill: currentColor; }
.switch { position: relative; flex: none; width: 50px; height: 30px; padding: 0; border: 0; border-radius: 15px; background: var(--line); cursor: pointer; transition: background-color .2s; }
.switch i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--green); }
.switch[aria-checked="true"] i { transform: translateX(20px); }
.switch.sm { width: 42px; height: 26px; }
.switch.sm i { width: 20px; height: 20px; }
.switch.sm[aria-checked="true"] i { transform: translateX(16px); }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 8px 0; }
.switch-row strong { display: block; font-size: 15px; }
.switch-row span { display: block; font-size: 13px; color: var(--ink-2); }

/* ---------- Tab bar ---------- */
.tabbar {
  flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  padding: 6px calc(var(--gr) - 12px) 8px calc(var(--gl) - 12px);
  background: var(--card); border-top: 1px solid var(--line);
}
.device .tabbar { padding-bottom: 24px; }
@media (max-width: 520px) { .device .tabbar { padding-bottom: 8px; } }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; border: 0; background: none; color: var(--ink-3); font: 600 11.5px var(--font-ui); cursor: pointer; }
.tab-ic { position: relative; display: grid; place-items: center; width: 54px; height: 32px; border-radius: 12px; transition: background-color .2s; }
.tab.on { color: var(--green); }
.tab.on .tab-ic { background: var(--green-soft); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--green) 30%, transparent); }
.tab.on .tab-label { font-weight: 800; }
.badge {
  position: absolute; top: -3px; right: 5px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px;
  background: var(--oxblood); color: #fff; box-shadow: 0 0 0 2px var(--card);
  font: 700 11px/19px var(--font-ui); text-align: center; font-variant-numeric: tabular-nums;
}

/* ---------- Sheets and toasts ---------- */
.sheet-wrap { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; }
.scrim { position: absolute; inset: 0; background: rgba(8, 14, 11, .48); }
.sheet {
  position: relative; max-height: 90%; overflow-y: auto; overscroll-behavior: contain;
  padding: 8px var(--gr) 26px var(--gl); border-radius: 26px 26px 0 0;
  background: var(--card); box-shadow: 0 -10px 30px rgba(0, 0, 0, .2);
}
.sheet-wrap.in .scrim { animation: fade .25s ease-out; }
.sheet-wrap.in .sheet { animation: rise .32s cubic-bezier(.2, .8, .2, 1); }
.grabber { width: 40px; height: 5px; margin: 4px auto 14px; border-radius: 3px; background: var(--line); }
.sheet h2 { margin: 0 0 14px; font: 400 23px/1.15 var(--font-display); }
.sheet > .muted { margin: -6px 0 6px; }
.sheet-book { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; background: var(--paper); }

const plural = (n, word, many) => `${n} ${n === 1 ? word : (many || word + 's')}`;

function icon(name, cls = '') {
  return `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`;
}

/* Cover art: each motif is drawn on a 100 x 150 grid.
   Classes: a = accent fill, as = accent stroke, f = title-colour fill, fs = title-colour stroke. */
const STAR_DOTS = [[12, 20], [30, 12], [78, 18], [88, 40], [66, 30], [20, 46], [84, 70], [10, 82], [40, 28], [58, 10], [92, 96], [8, 120], [90, 128], [28, 138], [70, 140]]
  .map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="${i % 3 ? 0.8 : 1.3}" class="f" opacity=".75"/>`).join('');

const MOTIFS = {
  emblem: '<circle cx="50" cy="92" r="23" class="as" stroke-width="2.4"/><circle cx="50" cy="92" r="17" class="as" stroke-width=".8" opacity=".6"/><path d="M35 97 50 76l15 21-15-7z" class="a"/>',
  bird: '<path d="M27 99c9-17 22-24 35-16 6-7 13-9 20-7-6 4-9 9-10 15-6 14-27 18-45 8z" class="a" opacity=".9"/><path d="M14 120c14-9 26-9 36-2s22 8 36-1" class="fs" stroke-width="2.2"/><circle cx="67" cy="82" r="1.6" class="f"/>',
  sun: '<circle cx="50" cy="118" r="32" class="a" opacity=".85"/><path d="M0 118h100M0 126h100M0 134h100M0 142h100" class="fs" stroke-width="1.6" opacity=".55"/>',
  waves: '<g class="fs" stroke-width="2" opacity=".55"><path d="M-6 108q8-7 16 0t16 0 16 0 16 0 16 0 16 0 16 0"/><path d="M-6 118q8-7 16 0t16 0 16 0 16 0 16 0 16 0 16 0"/><path d="M-6 128q8-7 16 0t16 0 16 0 16 0 16 0 16 0 16 0"/></g><circle cx="76" cy="90" r="7" class="a" opacity=".9"/>',
  stars: STAR_DOTS + '<path d="m50 58 4 12h12l-10 7 4 12-10-7-10 7 4-12-10-7h12z" class="a" opacity=".9"/>',
  key: '<g class="as" stroke-width="3.2"><circle cx="50" cy="80" r="11"/><path d="M50 91v34M50 110h9M50 119h6"/></g>',
  arch: '<path d="M28 132V90a22 22 0 0 1 44 0v42" class="as" stroke-width="2.4"/><path d="M36 132V91a14 14 0 0 1 28 0v41z" class="a" opacity=".28"/><path d="M20 132h60" class="as" stroke-width="2.4"/>',
  diamond: '<g class="as" stroke-width="1.6"><path d="M50 66l22 28-22 28-22-28z"/><path d="M50 78l12 16-12 16-12-16z" opacity=".7"/></g><circle cx="50" cy="94" r="2.4" class="a"/>',
  maze: '<g class="fs" stroke-width="2.4" opacity=".8"><path d="M18 56h64v68H18V64"/><path d="M26 64h48v52H26V72"/><path d="M34 72h32v36H34V80"/><path d="M42 80h16v20H42"/></g>',
  crown: '<path d="M27 102l6-24 11 13 6-19 6 19 11-13 6 24z" class="a"/><rect x="27" y="105" width="46" height="5" rx="1" class="a"/>',
  planet: STAR_DOTS + '<circle cx="62" cy="100" r="17" class="a"/><ellipse cx="62" cy="100" rx="30" ry="6.5" class="as" stroke-width="1.6" transform="rotate(-18 62 100)"/>',
  shatter: '<g class="as" stroke-width="1.1"><path d="M52 92 18 58M52 92l36-22M52 92 30 136M52 92l24 40M52 92V46M52 92l45 8M52 92 4 106M40 80l-8 14 14 8M60 86l10 10-6 10"/></g>',
  target: '<g class="as" stroke-width="1.6"><circle cx="50" cy="84" r="27"/><circle cx="50" cy="84" r="18"/><circle cx="50" cy="84" r="9"/></g><circle cx="50" cy="84" r="3.2" class="a"/>',
  crows: '<g class="a"><path d="m22 58 9-6 9 6-9-3z"/><path d="m52 44 11-7 11 7-11-3.5z"/><path d="m40 74 8-5 8 5-8-2.5z"/></g>',
  wing: '<path d="M50 124c-26-6-34-34-30-58 9 15 19 23 30 25zM50 124c26-6 34-34 30-58-9 15-19 23-30 25z" class="a" opacity=".9"/>',
  heart: '<path d="M50 116C22 98 28 72 43 74c4 .6 6 3.6 7 6 1-2.4 3-5.4 7-6 15-2 21 24-7 42z" class="a"/><path d="M71 62 33 112" class="fs" stroke-width="2.2"/>',
  rings: '<g class="as" stroke-width="2"><circle cx="40" cy="92" r="17"/><circle cx="60" cy="92" r="17"/></g><circle cx="50" cy="92" r="3" class="a"/>',
  tower: '<path d="M43 132V84l7-14 7 14v48z" class="a" opacity=".9"/><path d="M20 132v-32l10-8 10 8v32M60 132V96l10-8 10 8v36" class="as" stroke-width="1.6"/>',
};
const MOTIF_SHIFT = { bottom: -34, stack: 14 };

function cover(id, cls = '') {
  const b = BOOKS[id];
  if (!b) return '';
  const [bg, bg2, fg, ac] = b.cover.c;
  const shift = MOTIF_SHIFT[b.cover.l] || 0;
  const longest = Math.max(...b.title.split(/\s+/).map(w => w.length));
  if (longest >= 10 || b.title.length > 34) cls += ' t-long'; // smaller title type so long words don't break
  return `<div class="cover l-${b.cover.l} ${cls}" style="--cb:${bg};--cb2:${bg2};--cf:${fg};--ca:${ac}" role="img" aria-label="Cover of ${esc(b.title)}">` +
    `<svg class="cover-art" viewBox="0 0 100 150" preserveAspectRatio="none" aria-hidden="true"><g transform="translate(0 ${shift})">${MOTIFS[b.cover.m] || ''}</g></svg>` +
    `<div class="cover-title f-${b.cover.f}">${esc(b.title)}</div><div class="cover-author">${esc(b.author)}</div></div>`;
}

/* Avatars use initials on a colour; real photos would come from accounts. */
function initials(id) {
  return PEOPLE[id].name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
}
function avatar(id, size = 40, cls = '') {
  const p = PEOPLE[id];
  if (!p) return '';
  return `<span class="av ${cls}" style="--av:${p.color};--s:${size}px" aria-hidden="true">${initials(id)}</span>`;
}
function avatarStack(ids, size = 52) {
  const shown = ids.slice(0, 3);
  return `<span class="av-stack n${shown.length}" style="--s:${size}px" aria-hidden="true">` +
    shown.map(id => avatar(id, Math.round(size * 0.6))).join('') + '</span>';
}

/* Stars: display-only when no book id is given, otherwise a tappable rating control. */
function stars(n, opts = {}) {
  const { book, size = 14 } = opts;
  let h = '';
  for (let i = 1; i <= 5; i++) {
    const state = n >= i - 0.25 ? 'on' : n >= i - 0.75 ? 'half' : '';
    const inner = icon('star') + (state === 'half' ? icon('star', 'half-fill') : '');
    h += book
      ? `<button type="button" class="star ${state}" data-act="rate" data-id="${book}" data-v="${i}" aria-label="Rate ${plural(i, 'star')}" aria-pressed="${n >= i}">${inner}</button>`
      : `<span class="star ${state}">${inner}</span>`;
  }
  const label = book ? `role="group" aria-label="Your rating: ${n || 'none'} of 5"` : `role="img" aria-label="${n} out of 5 stars"`;
  return `<span class="stars${book ? ' rate' : ''}" style="--ss:${size}px" ${label}>${h}</span>`;
}

/* Two kinds of chips, styled differently on purpose:
   copy chips describe a physical copy, reading chips describe your own reading list. */
const COPY_LABEL = { available: 'Available', pending: 'Request pending', borrowed: 'Borrowed', unavailable: 'Unavailable' };
const COPY_ICON = { pending: 'clock', borrowed: 'swap', unavailable: 'minus' };
function copyChip(code, text) {
  const mark = code === 'available' ? '<i class="dot"></i>' : icon(COPY_ICON[code]);
  return `<span class="chip st-${code}">${mark}${esc(text || COPY_LABEL[code])}</span>`;
}
const READ_LABEL = { want: 'Want to read', reading: 'Currently reading', finished: 'Finished' };
function readChip(status, fav) {
  if (!status) return '';
  return `<span class="chip rd">${icon('bookmark')}${READ_LABEL[status]}</span>` + (fav ? `<span class="chip fav" title="Favorite">${icon('heart')}<span class="sr">Favorite</span></span>` : '');
}

/* Dates and times */
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WEEKDAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
const shortDate = iso => { const d = new Date(iso); return `${MON[d.getMonth()]} ${d.getDate()}`; };
const daysUntil = iso => Math.round((startOfDay(new Date(iso)) - startOfDay(new Date())) / DAY);
function dueText(iso) {
  const n = daysUntil(iso);
  if (n > 1) return `Due in ${n} days`;
  if (n === 1) return 'Due tomorrow';
  if (n === 0) return 'Due today';
  return `Overdue by ${plural(-n, 'day')}`;
}
/* Library date-due stamp, e.g. "DUE OCT 26" */
function stamp(iso, prefix = 'Due') {
  const d = new Date(iso);
  return `<span class="stamp">${prefix} ${MON[d.getMonth()]} ${String(d.getDate()).padStart(2, '0')}</span>`;
}
function clockTime(ts) {
  const d = new Date(ts);
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2, '0');
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${m} ${ap}`;
}
function timeLabel(ts) {
  const days = Math.round((startOfDay(new Date()) - startOfDay(new Date(ts))) / DAY);
  if (days <= 0) return clockTime(ts);
  if (days === 1) return 'Yesterday';
  if (days < 7) return WEEKDAY[new Date(ts).getDay()];
  return shortDate(ts);
}

/* Approximate distance from you, based on neighbourhood-level map spots. */
function distance(personId) {
  const a = PEOPLE.me, b = PEOPLE[personId];
  const mi = Math.hypot(b.x - a.x, (b.y - a.y) * 1.6) * 0.032;
  return mi < 0.5 ? 'under 0.5 mi' : `about ${mi.toFixed(1)} mi`;
}

<script>
/* Shelfmates prototype: app state and the rules for books, copies, loans, friends and chats.
   State is saved in this browser only (localStorage). Nothing is sent anywhere. */

const STORE_KEY = 'shelfmates-demo-v1';
let uidCount = 0;
const uid = (p = 'i') => p + Date.now().toString(36) + (uidCount++).toString(36) + Math.random().toString(36).slice(2, 5);
const TYPING = {}; // convo id -> person id while a sample reply is "typing"

let S = loadState();

function loadState() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { s = null; }
  if (!s || s.v !== 1) s = seedState();
  Object.assign(BOOKS, s.customBooks || {});
  return s;
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* private mode: keep going in memory */ }
}
function resetDemo() {
  for (const id of Object.keys(S.customBooks || {})) delete BOOKS[id];
  S = seedState();
  for (const k of Object.keys(TYPING)) delete TYPING[k];
  save();
}

/* ---------- Physical copies and loans ---------- */

const copyById = id => S.copies.find(c => c.id === id);
const loanById = id => S.loans.find(l => l.id === id);
const isOpen = l => l.status === 'pending' || l.status === 'accepted';
const activeLoan = copyId => S.loans.find(l => l.copy === copyId && isOpen(l));
const copiesOf = bookId => S.copies.filter(c => c.book === bookId);
const myCopy = bookId => S.copies.find(c => c.book === bookId && c.owner === 'me');
const isFriend = id => S.friends.includes(id);

/* Every copy is in one of four states: available, pending, borrowed, unavailable. */
function copyState(copy) {
  const loan = activeLoan(copy.id);
  if (loan && loan.status === 'accepted') return { code: 'borrowed', loan };
  if (loan) return { code: 'pending', loan };
  return { code: copy.lendable ? 'available' : 'unavailable', loan: null };
}

/* The same state, worded for whoever is looking at it. */
function copyLabel(copy, st = copyState(copy)) {
  const mine = copy.owner === 'me';
  const who = st.loan ? PEOPLE[st.loan.borrower].first : '';
  if (st.code === 'borrowed') return st.loan.borrower === 'me' ? dueText(st.loan.due) : mine ? `Lent to ${who}` : 'Borrowed';
  if (st.code === 'pending') return mine ? `${who} asked to borrow` : 'Request pending';
  if (st.code === 'unavailable') return mine ? 'Not lending' : 'Unavailable';
  return mine ? 'Available to lend' : 'Available';
}

/* Copies owned by other people, friends first, then closest. */
function otherCopies(bookId) {
  return copiesOf(bookId).filter(c => c.owner !== 'me').sort((a, b) => {
    const f = (isFriend(b.owner) ? 1 : 0) - (isFriend(a.owner) ? 1 : 0);
    if (f) return f;
    const d = p => Math.hypot(PEOPLE[p].x - PEOPLE.me.x, (PEOPLE[p].y - PEOPLE.me.y) * 1.6);
    return d(a.owner) - d(b.owner);
  });
}
const availableCopies = bookId => otherCopies(bookId).filter(c => copyState(c).code === 'available');
const myOpenLoanFor = bookId => S.loans.find(l => isOpen(l) && l.borrower === 'me' && copyById(l.copy).book === bookId);
const incomingRequests = () => S.loans.filter(l => l.status === 'pending' && copyById(l.copy).owner === 'me');

/* Home > Your Books: anything you are borrowing, have asked for, are reading, or own. */
function yourBooks() {
  const out = [], seen = new Set();
  const add = (book, line, tone, due) => { if (!seen.has(book)) { seen.add(book); out.push({ book, line, tone, due }); } };
  S.loans.filter(l => l.borrower === 'me' && l.status === 'accepted').forEach(l => add(copyById(l.copy).book, dueText(l.due), 'borrowed', l.due));
  S.loans.filter(l => l.borrower === 'me' && l.status === 'pending').forEach(l => add(copyById(l.copy).book, 'Request pending', 'pending'));
  Object.entries(S.library).filter(([, e]) => e.status === 'reading').forEach(([id]) => add(id, 'Currently reading', 'reading'));
  const mine = S.copies.filter(c => c.owner === 'me').map(c => ({ c, st: copyState(c) }));
  const order = { pending: 0, borrowed: 1, available: 2, unavailable: 3 };
  mine.sort((a, b) => order[a.st.code] - order[b.st.code]);
  mine.forEach(({ c, st }) => add(c.book, copyLabel(c, st), st.code === 'pending' ? 'pending' : st.code === 'borrowed' ? 'lent' : st.code));
  return out;
}

/* Home > Discover: books you could borrow, in a hand-picked order. */
const DISCOVER_ORDER = ['inherit', 'maze', 'naturals', 'ballad', 'crows', 'legendborn', 'oneofus', 'shatter', 'powerless', 'grandest', 'liars', 'fourth', 'villain', 'sunrise'];
function discoverBooks() {
  return DISCOVER_ORDER.filter(id => BOOKS[id] && !myCopy(id) && S.library[id]?.status !== 'finished' &&
    !S.loans.some(l => l.borrower === 'me' && l.status === 'accepted' && copyById(l.copy).book === id));
}

/* ---------- Your reading shelf (separate from physical copies) ---------- */

function ensureEntry(bookId) {
  if (!S.library[bookId]) S.library[bookId] = { status: 'want', rating: 0, fav: false, shelves: [], added: Date.now() };
  return S.library[bookId];
}
const setStatus = (bookId, status) => { ensureEntry(bookId).status = status; };
const toggleFav = bookId => { const e = ensureEntry(bookId); e.fav = !e.fav; return e.fav; };
function setRating(bookId, n) {
  const e = ensureEntry(bookId);
  e.rating = e.rating === n ? 0 : n; // tapping the same star again clears it
  return e.rating;
}
const removeFromShelf = bookId => { delete S.library[bookId]; };
function toggleShelf(bookId, shelfId) {
  const e = ensureEntry(bookId);
  e.shelves = e.shelves.includes(shelfId) ? e.shelves.filter(s => s !== shelfId) : [...e.shelves, shelfId];
}
function createShelf(name) {
  const id = uid('s');
  S.shelves.push({ id, name });
  return id;
}

/* Collections shown on My Books: reading statuses, favorites, your physical copies, then custom shelves. */
function collections() {
  const lib = Object.entries(S.library);
  const pick = f => lib.filter(([, e]) => f(e)).sort((a, b) => b[1].added - a[1].added).map(([id]) => id);
  return [
    { id: 'want', name: 'Want to Read', books: pick(e => e.status === 'want') },
    { id: 'reading', name: 'Currently Reading', books: pick(e => e.status === 'reading') },
    { id: 'finished', name: 'Finished', books: pick(e => e.status === 'finished') },
    { id: 'fav', name: 'Favorites', books: pick(e => e.fav) },
    { id: 'owned', name: 'My Copies', books: S.copies.filter(c => c.owner === 'me').map(c => c.book), physical: true },
    ...S.shelves.map(s => ({ id: s.id, name: s.name, custom: true, books: pick(e => e.shelves.includes(s.id)) })),
  ];
}

function addMyCopy(bookId, lendable) {
  if (!myCopy(bookId)) S.copies.push({ id: uid('m'), book: bookId, owner: 'me', lendable: !!lendable, cond: 'Good', note: '' });
}
function toggleLendable(copyId) {
  const c = copyById(copyId);
  c.lendable = !c.lendable;
  c.note = '';
  return c.lendable;
}

/* Books added by hand, from Goodreads or from Open Library get a drawn cover from these. */
const COVER_SWATCHES = [
  ['#284b63', '#153243', '#f4f9e9', '#e8c547'], ['#6b2737', '#3c1520', '#f7e7ce', '#e3b505'],
  ['#2d4a3e', '#16261f', '#f1e9da', '#c9a24a'], ['#e9d8a6', '#c9a96b', '#22223b', '#9b2226'],
  ['#3d348b', '#1f1a4d', '#f2efff', '#f7b801'], ['#c8553d', '#7a2e20', '#fff4e6', '#f6d8ae'],
  ['#dfe7e2', '#b8c9bf', '#1d3a2f', '#c8553d'], ['#14213d', '#0a1020', '#fca311', '#e5e5e5'],
  ['#5f0f40', '#310620', '#fbe9f1', '#fb8b24'], ['#f4f1de', '#e0dbbd', '#3d405b', '#e07a5f'],
];
const COVER_MOTIFS = ['stars', 'arch', 'diamond', 'rings', 'target', 'waves', 'tower', 'key', 'crown', 'sun'];
const COVER_FONTS = ['serif', 'garamond', 'sans'];
function addCustomBook(title, author, opts = {}) {
  const id = uid('x');
  const n = Object.keys(S.customBooks || {}).length;
  const book = {
    id, title, author: author || 'Unknown author', year: opts.year || null, genre: opts.genre || 'Added by you', rating: 0, ratings: 0,
    desc: opts.desc || 'You added this book by hand. In the full app, details would come from a book database or an ISBN scan.',
    cover: { c: COVER_SWATCHES[n % COVER_SWATCHES.length], m: COVER_MOTIFS[n % COVER_MOTIFS.length], f: COVER_FONTS[n % 3], l: 'top' },
  };
  S.customBooks = Object.assign(S.customBooks || {}, { [id]: book });
  BOOKS[id] = book;
  return id;
}

/* ---------- Conversations ---------- */

const convoById = id => S.convos.find(c => c.id === id);
const lastMsg = c => c.msgs[c.msgs.length - 1];
const convoTitle = c => c.kind === 'group' ? c.name : PEOPLE[c.members[0]].name;
const unreadTotal = () => S.convos.reduce((n, c) => n + (c.unread || 0), 0);
const sortedConvos = () => [...S.convos].sort((a, b) => (lastMsg(b)?.t || 0) - (lastMsg(a)?.t || 0));

function dmWith(personId) {
  let c = S.convos.find(x => x.kind === 'dm' && x.members[0] === personId);
  if (!c) {
    c = { id: 'd-' + personId, kind: 'dm', members: [personId], unread: 0, msgs: [] };
    S.convos.push(c);
  }
  return c;
}
function startGroup(members, name) {
  const c = { id: uid('g'), kind: 'group', name: name || members.map(m => PEOPLE[m].first).join(', '), members, unread: 0, msgs: [] };
  S.convos.push(c);
  return c;
}
function pushMsg(convo, from, text, extra) {
  const m = Object.assign({ id: uid('m'), from, text, t: Date.now() }, extra || {});
  convo.msgs.push(m);
  return m;
}

/* Sample replies make the chat feel alive. They are always labelled "Sample reply" in the UI. */
const REPLIES = [
  'Ha, same. I could not put it down.',
  'Ooh, good question. Let me check my shelf tonight.',
  'Yes! Bring it to book club Thursday?',
  'Sounds good. Text me when you are close.',
  'Adding that to my list right now.',
];
function pickReply(c, text) {
  const t = text.toLowerCase();
  if (/(liking|like it|think of|enjoy)/.test(t)) return 'Honestly obsessed. No spoilers, but the ending is wild.';
  if (/(when|saturday|sunday|pick ?up|meet|drop)/.test(t)) return 'Saturday morning works for me!';
  if (/(thank|thanks|thx)/.test(t)) return 'Anytime!';
  return REPLIES[c.msgs.length % REPLIES.length];
}
function scheduleReply(convoId, from, text) {
  setTimeout(() => { TYPING[convoId] = from; notify(); }, 600);
  setTimeout(() => {
    delete TYPING[convoId];
    const c = convoById(convoId);
    if (!c) return;
    pushMsg(c, from, text, { sim: true });
    if (!isViewingChat(convoId)) c.unread = (c.unread || 0) + 1;
    save();
    notify();
  }, 2200);
}
function sendMessage(convoId, text, extra) {
  const c = convoById(convoId);
  pushMsg(c, 'me', text, extra);
  const from = c.kind === 'dm' ? c.members[0] : c.members[c.msgs.length % c.members.length];
  scheduleReply(convoId, from, pickReply(c, text));
}

/* ---------- Borrowing workflow ---------- */

function requestBorrow(copyId, { weeks, pickup, message }) {
  const copy = copyById(copyId);
  const loan = { id: uid('L'), copy: copyId, borrower: 'me', status: 'pending', weeks, pickup, created: Date.now() };
  S.loans.push(loan);
  const c = dmWith(copy.owner);
  c.book = copy.book;
  pushMsg(c, 'me', message, { kind: 'request', loan: loan.id });
  return { loan, convo: c };
}

/* Accept or decline. When you own the copy this is your real decision in the prototype;
   when someone else owns it, the chat offers a clearly marked demo control to play their side. */
function respondToLoan(loanId, accept) {
  const l = loanById(loanId);
  const copy = copyById(l.copy);
  const book = BOOKS[copy.book];
  const ownerIsMe = copy.owner === 'me';
  const other = ownerIsMe ? l.borrower : copy.owner;
  const ownerName = ownerIsMe ? 'You' : PEOPLE[copy.owner].first;
  const c = dmWith(other);
  l.updated = Date.now();
  if (accept) {
    l.status = 'accepted';
    l.due = daysFromNow(l.weeks * 7);
    pushMsg(c, 'system', `${ownerName} accepted the request for ${book.title}. Due back ${shortDate(l.due)}.`, { kind: 'system' });
  } else {
    l.status = 'declined';
    pushMsg(c, 'system', `${ownerName} declined the request for ${book.title}.`, { kind: 'system' });
  }
  if (ownerIsMe) {
    scheduleReply(c.id, other, accept ? 'Thank you!! I will take good care of it.' : 'No worries, thanks anyway!');
  } else {
    const spot = PICKUPS[l.pickup].replace(/ \(.*\)$/, '');
    pushMsg(c, other, accept
      ? (l.pickup === 'porch' ? 'Sure! I will message you my porch details. Saturday morning OK?' : `Sure! I can leave it at ${spot} on Saturday morning. Enjoy!`)
      : 'Sorry! I already promised it to my cousin this month. Maybe someone else nearby has a copy?', { sim: true });
  }
  return { loan: l, convo: c };
}
function cancelRequest(loanId) {
  const l = loanById(loanId);
  const copy = copyById(l.copy);
  l.status = 'cancelled';
  pushMsg(dmWith(copy.owner), 'system', `You cancelled your request for ${BOOKS[copy.book].title}.`, { kind: 'system' });
}
function markReturned(loanId) {
  const l = loanById(loanId);
  const copy = copyById(l.copy);
  const other = copy.owner === 'me' ? l.borrower : copy.owner;
  l.status = 'returned';
  l.returned = Date.now();
  const owner = copy.owner === 'me' ? 'you' : PEOPLE[copy.owner].first;
  pushMsg(dmWith(other), 'system', `${BOOKS[copy.book].title} was returned to ${owner}.`, { kind: 'system' });
}

/* ---------- Friends ---------- */

function relation(id) {
  if (id === 'me') return 'me';
  if (isFriend(id)) return 'friend';
  if (S.friendRequests.some(r => r.from === id)) return 'incoming';
  if (S.sentRequests.includes(id)) return 'sent';
  return 'none';
}
function acceptFriend(reqId) {
  const r = S.friendRequests.find(x => x.id === reqId);
  S.friendRequests = S.friendRequests.filter(x => x.id !== reqId);
  if (r && !isFriend(r.from)) S.friends.push(r.from);
  return r && r.from;
}
function declineFriend(reqId) {
  const r = S.friendRequests.find(x => x.id === reqId);
  S.friendRequests = S.friendRequests.filter(x => x.id !== reqId);
  return r && r.from;
}
const sendFriendRequest = id => { if (!S.sentRequests.includes(id)) S.sentRequests.push(id); };
const cancelFriendRequest = id => { S.sentRequests = S.sentRequests.filter(x => x !== id); };
const sharedBy = personId => S.copies.filter(c => c.owner === personId);

/* ---------- Search ---------- */

function searchBooks(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  return Object.values(BOOKS).filter(b => `${b.title} ${b.author} ${b.genre}`.toLowerCase().includes(q));
}
function searchPeople(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  return Object.values(PEOPLE).filter(p => p.id !== 'me' && p.name.toLowerCase().includes(q));
}
