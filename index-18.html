    const b = BOOKS[c.book], st = copyState(c), who = c.owner === 'me' ? 'You' : PEOPLE[c.owner].first;
    return `<div class="ms-main" style="margin:10px 0"><button type="button" class="ms-cover" data-act="openBook" data-id="${c.book}" aria-label="Open ${esc(b.title)}">${cover(c.book)}</button>
      <div class="ms-text"><strong class="ms-title">${esc(b.title)}</strong><span>${esc(b.author)}</span><span class="muted small">${esc(who)} · ${COPY_LABEL[st.code]}</span></div></div>`;
  }).join('');
  return `${topbar(g.name)}<div class="body has-topbar"><div class="pad stack">
    ${g.description ? `<p class="muted">${esc(g.description)}</p>` : ''}
    <div class="field-label">Group feed</div>
    ${compose}
    <div>${tops.map(p => postHtml(p, g, kidsOf(p.id))).join('') || '<p class="muted">No posts yet. Start the conversation.</p>'}</div>
    <div class="field-label">What everyone's reading</div>
    ${readers || '<p class="muted">Nobody has a current read marked yet.</p>'}
    <div class="field-label">Books to borrow (${pool.length})</div>
    ${rows || '<p class="muted">Nothing yet. When members switch lending on for a book, it shows up here.</p>'}
    <div class="field-label">Members (${g.members.length})</div>
    <div class="list">${members}</div>
    <div class="field-label">Invite people</div>
    <p style="margin:0"><strong style="font-size:22px;letter-spacing:3px">${esc(g.code.toUpperCase())}</strong></p>
    <button type="button" class="btn soft full" data-act="shareGroup" data-id="${g.id}">Share invite link</button>
    <button type="button" class="btn ghost full" style="margin-top:14px" data-act="${mineOwner ? 'deleteGroupOpen' : 'leaveGroupOpen'}" data-id="${g.id}">${mineOwner ? 'Delete group' : 'Leave group'}</button>
  </div></div>`;
};

/* Entry points */
const friendsBase = SCREENS.friends;
SCREENS.friends = t => {
  const out = friendsBase(t), at = out.indexOf('<section');
  if (!signedIn() || at < 0) return out;
  const n = (S.groups || []).length;
  return out.slice(0, at) + `<div class="pad" style="margin-top:8px"><button type="button" class="btn soft full" data-act="groups">Groups${n ? ` (${n})` : ''}</button></div>` + out.slice(at);
};
const authBase = authScreen;
authScreen = () => {
  let out = authBase(), c = null; try { c = localStorage.getItem(GKEY); } catch (e) { /* ignore */ }
  return c ? out.replace('<label class="field-label"', m => '<p class="sheet-note">You\'re invited to join a group. Sign up or log in and you\'ll be added.</p>' + m) : out;
};

/* Actions */
const api = () => window.sbClient, refresh = () => (window.cloudApi ? window.cloudApi.refresh() : Promise.resolve());
ACT.groups = () => go('groups');
ACT.openGroup = d => go('group', { id: d.id });
ACT.createGroupOpen = () => openSheet({ type: 'createGroup', name: '', desc: '' });
ACT.joinGroupOpen = () => openSheet({ type: 'joinGroup', code: '' });
ACT.leaveGroupOpen = d => openSheet({ type: 'leaveGroup', id: d.id });
ACT.deleteGroupOpen = d => openSheet({ type: 'deleteGroup', id: d.id });
ACT.createGroup = async () => {
  const sh = UI.sheet, name = (sh.name || '').trim();
  if (!name) { toast('Give the group a name'); return; }
  const { data, error } = await api().rpc('create_group', { p_name: name.slice(0, 60), p_desc: (sh.desc || '').trim().slice(0, 200) });
  if (error) { toast('Couldn\'t create the group. Try again.'); return; }
  await refresh(); UI.sheet = null; go('group', { id: data }); toast('Group created. Share the code with your members.');
};
ACT.joinGroup = async () => {
  const code = (UI.sheet.code || '').trim().toLowerCase();
  if (code.length < 8) { toast('Enter the 8-character code'); return; }
  const { data, error } = await api().rpc('join_group', { p_code: code });
  if (error) { toast('That code doesn\'t match a group'); return; }
  await refresh(); UI.sheet = null; go('group', { id: data }); toast('You joined the group');
};
ACT.confirmLeave = async () => {
  const id = UI.sheet.id, { error } = await api().from('group_members').delete().eq('group_id', id).eq('user_id', A.user.id);
  if (error) { toast('Couldn\'t leave. Try again.'); return; }
  await refresh(); UI.sheet = null; UI.stacks = freshStacks(); UI.tab = 'friends'; render(); toast('You left the group');
};
ACT.confirmDeleteGroup = async () => {
  const id = UI.sheet.id, { error } = await api().from('groups').delete().eq('id', id);
  if (error) { toast('Couldn\'t delete the group. Try again.'); return; }
  await refresh(); UI.sheet = null; UI.stacks = freshStacks(); UI.tab = 'friends'; render(); toast('Group deleted');
};
ACT.shareGroup = async d => {
  const g = groupById(d.id); if (!g) return;
  const url = location.origin + location.pathname + '?group=' + g.code;
  try {
    if (navigator.share) { await navigator.share({ title: g.name, text: `Join ${g.name} on Shelfmates to share books.`, url }); return; }
    await navigator.clipboard.writeText(url); toast('Invite link copied');
  } catch (e) { if (!(e && e.name === 'AbortError')) toast('Copy this link: ' + url); }
};

const note = 'Members can see your name, your shelves and ratings, and the books you\'ve switched lending on for, and can ask to borrow them.';
SHEETS.createGroup = sh => `<h2 id="sheet-title">Create a group</h2>
  <label class="field-label" for="cg-n">Group name</label>
  <input id="cg-n" class="input" data-field="name" data-enter="createGroup" value="${esc(sh.name)}" maxlength="60" placeholder="Room 204 Book Club" data-autofocus>
  <label class="field-label" for="cg-d">About (optional)</label>
  <input id="cg-d" class="input" data-field="desc" data-enter="createGroup" value="${esc(sh.desc)}" maxlength="200" placeholder="What is this group for?">
  <p class="muted small">${note}</p>
  ${sheetActions('Cancel', '<button type="button" class="btn primary" data-act="createGroup">Create</button>')}`;
SHEETS.joinGroup = sh => `<h2 id="sheet-title">Join a group</h2>
  <label class="field-label" for="jg-c">Invite code</label>
  <input id="jg-c" class="input" data-field="code" data-enter="joinGroup" value="${esc(sh.code)}" maxlength="8" placeholder="8 characters" autocapitalize="characters" data-autofocus>
  <p class="muted small">${note}</p>
  ${sheetActions('Cancel', '<button type="button" class="btn primary" data-act="joinGroup">Join</button>')}`;
SHEETS.leaveGroup = sh => `<h2 id="sheet-title">Leave ${esc((groupById(sh.id) || {}).name || 'this group')}?</h2>
  <p class="muted">Its members will stop seeing the books you offered through this group. You can rejoin with the code.</p>
  ${sheetActions('Stay', '<button type="button" class="btn primary" data-act="confirmLeave">Leave</button>')}`;
SHEETS.deleteGroup = sh => `<h2 id="sheet-title">Delete ${esc((groupById(sh.id) || {}).name || 'this group')}?</h2>
  <p class="muted">This removes the group for everyone. Nobody's books or friendships are deleted.</p>
  ${sheetActions('Keep it', '<button type="button" class="btn primary" style="background:#a3392b" data-act="confirmDeleteGroup">Delete group</button>')}`;

/* Feed actions */
const gid = () => cur().id;
const newId = () => crypto.randomUUID();
const addPost = async (group, body, book, parent) => {
  const row = { id: newId(), group_id: group, author: A.user.id, body, book_id: book || null, parent_id: parent || null };
  const { error } = await api().from('group_posts').insert(row);
  if (error) { toast('Couldn\'t post that: ' + (error.message || 'unknown error').slice(0, 90)); return false; }
  S.posts = (S.posts || []).concat({ id: row.id, group, author: 'me', body, book: row.book_id, parent: row.parent_id, t: Date.now() });
  return true;
};
ACT.postFeed = async () => {
  const g = gid(), f = document.getElementById('post-box'), text = (f ? f.value : UI.drafts['post:' + g] || '').trim();
  if (!text) { toast('Write something first'); return; }
  if (await addPost(g, text, UI.drafts['postbook:' + g], null)) { UI.drafts['post:' + g] = ''; UI.drafts['postbook:' + g] = ''; render(); }
};
ACT.replyOpen = d => { UI.replyTo = UI.replyTo === d.id ? null : d.id; render(); };
ACT.replySend = async d => {
  const pid = d.id || UI.replyTo, f = document.getElementById('reply-box'), text = (f ? f.value : UI.drafts['reply:' + pid] || '').trim();
  if (!text || !pid) { toast('Write a reply first'); return; }
  if (await addPost(gid(), text, null, pid)) { UI.drafts['reply:' + pid] = ''; render(); }
};
ACT.likePost = async d => {
  const list = (S.likeMap = S.likeMap || {}), cur0 = list[d.id] || [], liked = cur0.includes('me');
  list[d.id] = liked ? cur0.filter(x => x !== 'me') : cur0.concat('me'); render();
  const q = liked ? api().from('post_likes').delete().eq('post_id', d.id).eq('user_id', A.user.id) : api().from('post_likes').insert({ post_id: d.id, user_id: A.user.id });
  const { error } = await q;
  if (error) { list[d.id] = cur0; render(); toast('Couldn\'t save that heart. Try again.'); }
};
ACT.deletePostOpen = d => openSheet({ type: 'deletePost', id: d.id });
ACT.confirmDeletePost = async () => {
  const id = UI.sheet.id, { error } = await api().from('group_posts').delete().eq('id', id);
  if (error) { toast('Couldn\'t delete that. Try again.'); return; }
  S.posts = (S.posts || []).filter(p => p.id !== id && p.parent !== id); UI.sheet = null; render(); toast('Post deleted');
};
ACT.reportPost = d => {
  const p = (S.posts || []).find(x => x.id === d.id); if (!p) return;
  openSheet({ type: 'reportUser', id: p.author, reason: '', details: `Group post: "${p.body.slice(0, 120)}"` });
};
ACT.attachBookOpen = () => openSheet({ type: 'attachBook', gid: gid(), q: '' });
ACT.pickPostBook = d => { UI.drafts['postbook:' + UI.sheet.gid] = d.id; UI.sheet = null; render(); };
ACT.unpickPostBook = () => { UI.drafts['postbook:' + gid()] = ''; render(); };

SHEETS.attachBook = sh => {
  const q = (sh.q || '').trim(), ids = q ? searchBooks(q).slice(0, 8).map(b => b.id) : Object.keys(S.library).filter(id => BOOKS[id]).slice(0, 8);
  const rows = ids.map(id => `<button type="button" class="result" data-act="pickPostBook" data-id="${id}">${cover(id, 'xs')}<span class="result-text"><strong>${esc(BOOKS[id].title)}</strong><span>${esc(BOOKS[id].author)}</span></span></button>`).join('');
  return `<h2 id="sheet-title">Attach a book</h2>
    <input class="input" data-field="q" data-live="1" value="${esc(sh.q)}" placeholder="Search by title or author" autocomplete="off" data-autofocus>
    <div class="list" style="margin-top:8px">${rows || '<p class="muted">No matches. Try another title.</p>'}</div>
    ${sheetActions('Cancel', '')}`;
};
SHEETS.deletePost = () => `<h2 id="sheet-title">Delete this post?</h2><p class="muted">This also removes any replies to it.</p>
  ${sheetActions('Keep it', '<button type="button" class="btn primary" style="background:#a3392b" data-act="confirmDeletePost">Delete</button>')}`;
})();

</script>
<script>
/* Shelfmates: browse a friend's or group member's shelves, on their profile and right on the Friends tab. */
(() => {
const tabsFor = data => {
  const rows = data.rows, by = s => rows.filter(r => r.status === s);
  const tabs = [{ id: 'reading', label: 'Reading', list: by('reading') }, { id: 'want', label: 'Want to read', list: by('want') },
    { id: 'finished', label: 'Finished', list: by('finished') }, { id: 'fav', label: 'Favorites', list: rows.filter(r => r.fav) }];
  (data.shelves || []).forEach(s => { const list = rows.filter(r => (r.shelves || []).includes(s.id)); if (list.length) tabs.push({ id: 's:' + s.id, label: s.name, list }); });
  return tabs;
};
const stars = n => (n ? `<span class="muted small" role="img" aria-label="${n} out of 5 stars">${'★'.repeat(n)}${'☆'.repeat(5 - n)}</span>` : '');

/* The tabs and the book list for one person */
function shelvesBody(id, data) {
  const tabs = tabsFor(data);
  if (!data.rows.length) return '<p class="muted pad">No books on their shelves yet.</p>';
  const sel = (UI.theirTab && UI.theirTab[id]) || (tabs.find(x => x.list.length) || tabs[0]).id;
  const tab = tabs.find(x => x.id === sel) || tabs[0];
  const list = tab.list.slice().sort((a, b) => b.added - a.added).map(r => bookRow(r.book, stars(r.rating))).join('');
  return `<div class="pad" style="display:flex;flex-wrap:wrap;gap:8px">${tabs.map(x => `<button type="button" class="pill${x.id === tab.id ? ' on' : ''}" data-act="theirShelfTab" data-id="${esc(x.id)}" data-person="${id}" aria-pressed="${x.id === tab.id}">${esc(x.label)} (${x.list.length})</button>`).join('')}</div>
    <div class="pad list">${list || '<p class="muted">Nothing here yet.</p>'}</div>`;
}

/* On a person's profile */
const personBase = SCREENS.person;
SCREENS.person = t => {
  const out = personBase(t);
  if (t.id === 'me') return out;
  const at = out.indexOf('</dl>', out.indexOf('<dl class="stats">'));
  if (at < 0) return out;
  const data = (S.theirShelves || {})[t.id];
  const html = `<div class="field-label pad" style="margin-top:14px">Shelves</div>` + (data ? shelvesBody(t.id, data)
    : '<p class="muted pad">You can see someone\'s shelves once you\'re friends or in a group together.</p>');
  return out.slice(0, at + 5) + html + out.slice(at + 5);
};

/* On the Friends tab, under the books they're sharing */
const friendsBase = SCREENS.friends;
SCREENS.friends = t => {
  const out = friendsBase(t), sel = UI.selFriend, data = sel && (S.theirShelves || {})[sel];
  const at = out.indexOf('<section class="sec" id="requests">');
  if (!data || at < 0 || UI.q.friends.trim()) return out;
  const first = PEOPLE[sel] ? PEOPLE[sel].first : 'Their';
  return out.slice(0, at) + `<section class="sec">${sectionHead(`${esc(first)}'s shelves`, 'Reading, want to read, finished and more')}${shelvesBody(sel, data)}</section>` + out.slice(at);
};

ACT.theirShelfTab = d => { UI.theirTab = UI.theirTab || {}; UI.theirTab[d.person || cur().id] = d.id; render(); };
})();

</script>
</body></html>
