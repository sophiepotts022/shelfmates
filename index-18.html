<script>
/* Shelfmates prototype: navigation, rendering and every tap/typing handler. */

const TABS = ['friends', 'books', 'home', 'map', 'messages'];
const TAB_LABEL = { friends: 'Friends', books: 'Books', home: 'Home', map: 'Map', messages: 'Messages' };
const TAB_ICON = { friends: 'friends', books: 'book', home: 'home', map: 'map', messages: 'messages' };

/* UI state that is not saved: the open tab, a screen stack per tab, search text, the open sheet. */
let entryKey = 0;
const entry = (s, params) => Object.assign({ s, k: ++entryKey }, params || {});
const freshStacks = () => Object.fromEntries(TABS.map(t => [t, [entry(t)]]));
const UI = {
  tab: 'home',
  stacks: freshStacks(),
  q: { home: '', books: '', friends: '', map: '', messages: '' },
  selFriend: 'maya',
  booksView: 'list', booksShelf: null, booksSort: 'recent',
  mapArea: 'all', mapOwner: null, mapBook: null, mapAvailOnly: true,
  msgsExpanded: false,
  sheet: null, sheetIn: false,
  drafts: {},
  hscroll: {},
  anim: null,
};

const cur = () => UI.stacks[UI.tab][UI.stacks[UI.tab].length - 1];
const isViewingChat = id => cur().s === 'chat' && cur().id === id;
function notify() { render(); }

function go(screen, params) {
  UI.stacks[UI.tab].push(entry(screen, params));
  UI.anim = 'push';
  UI.sheet = null;
  render();
}
function back() {
  const st = UI.stacks[UI.tab];
  if (st.length > 1) { st.pop(); UI.anim = 'pop'; render(); }
}
function switchTab(tab) {
  if (UI.tab === tab) UI.stacks[tab] = [UI.stacks[tab][0]]; // tapping the open tab goes back to its first screen
  UI.tab = tab;
  UI.anim = 'fade';
  UI.sheet = null;
  render();
}
function openChat(convoId) {
  const c = convoById(convoId);
  if (c) c.unread = 0;
  UI.tab = 'messages';
  UI.stacks.messages = [UI.stacks.messages[0], entry('chat', { id: convoId })];
  UI.anim = 'push';
  UI.sheet = null;
  save();
  render();
}
function openSheet(sheet) { UI.sheet = sheet; UI.sheetIn = true; render(); }
function closeSheet() { UI.sheet = null; render(); }

/* ---------- Rendering ---------- */

function findEntry(k) {
  for (const t of TABS) { const e = UI.stacks[t].find(x => x.k === k); if (e) return e; }
  return null;
}

function render() {
  const app = document.getElementById('app');
  // Remember where the current screen was scrolled, and which field had focus.
  const old = app.querySelector('.screen');
  if (old) {
    const e = findEntry(+old.dataset.k);
    const main = old.querySelector('.body');
    if (e && main) e.y = main.scrollTop;
  }
  app.querySelectorAll('[data-hscroll]').forEach(el => { UI.hscroll[el.dataset.hscroll] = el.scrollLeft; });
  const a = document.activeElement;
  const focus = a && a.id && app.contains(a) ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;

  const t = cur();
  const anim = UI.anim;
  UI.anim = null;
  const sheetIn = UI.sheetIn;
  UI.sheetIn = false;
  app.innerHTML =
    `<div class="screen${anim ? ' anim-' + anim : ''}" data-k="${t.k}" data-s="${t.s}">${SCREENS[t.s](t)}</div>` +
    renderNav() + renderSheet(sheetIn);

  const main = app.querySelector('.screen .body');
  if (main) main.scrollTop = t.s === 'chat' ? main.scrollHeight : (t.y || 0);
  app.querySelectorAll('[data-hscroll]').forEach(el => {
    el.scrollLeft = UI.hscroll[el.dataset.hscroll] || 0;
    syncDots(el);
    el.addEventListener('scroll', () => syncDots(el), { passive: true });
  });
  if (focus) {
    const f = document.getElementById(focus.id);
    if (f) { f.focus({ preventScroll: true }); try { f.setSelectionRange(focus.s, focus.e); } catch (err) { /* not a text field */ } }
  }
  const sheetFocus = sheetIn && app.querySelector('.sheet [data-autofocus]');
  if (sheetFocus) sheetFocus.focus({ preventScroll: true });
}

/* Page dots under carousels, as in the sketches. */
function syncDots(el) {
  const dots = el.parentElement.querySelector('.dots');
  if (!dots) return;
  const pages = Math.max(1, Math.round(el.scrollWidth / el.clientWidth));
  const max = el.scrollWidth - el.clientWidth;
  const at = max > 0 ? Math.round((el.scrollLeft / max) * (pages - 1)) : 0;
  if (dots.childElementCount !== pages) dots.innerHTML = pages > 1 ? '<i></i>'.repeat(pages) : '';
  [...dots.children].forEach((d, i) => d.classList.toggle('on', i === at));
}

function renderNav() {
  const badge = { friends: S.friendRequests.length + incomingRequests().length, messages: unreadTotal() };
  return `<nav class="tabbar" aria-label="Main">${TABS.map(t => {
    const on = UI.tab === t;
    const n = badge[t] || 0;
    return `<button type="button" class="tab${on ? ' on' : ''}" data-act="tab" data-id="${t}" ${on ? 'aria-current="page"' : ''}>` +
      `<span class="tab-ic">${icon(TAB_ICON[t])}${n ? `<b class="badge" aria-label="${n} new">${n}</b>` : ''}</span><span class="tab-label">${TAB_LABEL[t]}</span></button>`;
  }).join('')}</nav>`;
}

function renderSheet(animateIn) {
  if (!UI.sheet) return '';
  const body = SHEETS[UI.sheet.type](UI.sheet);
  return `<div class="sheet-wrap${animateIn ? ' in' : ''}"><div class="scrim" data-act="closeSheet"></div>` +
    `<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="grabber" aria-hidden="true"></div>${body}</section></div>`;
}

let toastTimer = 0;
function toast(msg, action) {
  const host = document.getElementById('toast');
  host.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>` +
    (action ? `<button type="button" data-act="${action.act}" data-id="${action.id || ''}">${esc(action.label)}</button>` : '') + '</div>';
  host.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => host.classList.remove('show'), action ? 7000 : 4600);
}
const hideToast = () => document.getElementById('toast').classList.remove('show');

/* ---------- Actions: every data-act="…" in the markup lands here ---------- */

const done = (msg, action) => { save(); render(); if (msg) toast(msg, action); };

const ACT = {
  tab: d => switchTab(d.id),
  back: () => back(),
  openBook: d => go('book', { id: d.id }),
  openPerson: d => go('person', { id: d.id }),
  openChat: d => { hideToast(); openChat(d.id); },
  chatWith: d => {
    const c = dmWith(d.id);
    if (d.book) { c.book = d.book; UI.drafts[c.id] = `How are you liking ${BOOKS[d.book].title}?`; }
    openChat(c.id);
  },
  openReadingAll: () => go('reading'),
  closeSheet: () => closeSheet(),
  openSheet: d => openSheet({ type: d.id, q: '', sel: [], name: '' }),
  clearQ: d => { UI.q[d.id] = ''; render(); },

  /* Reading shelf */
  addToShelf: d => { setStatus(d.id, 'want'); done(`Saved to Want to Read. This doesn't reserve a copy.`); },
  setStatus: d => { setStatus(d.id, d.v); done(); },
  fav: d => { const on = toggleFav(d.id); done(on ? 'Added to Favorites' : 'Removed from Favorites'); },
  rate: d => { const n = setRating(d.id, +d.v); done(n ? `Rated ${plural(n, 'star')}` : 'Rating cleared'); },
  removeFromShelf: d => { removeFromShelf(d.id); done('Removed from your reading shelf'); },
  toggleShelf: d => { toggleShelf(d.id, d.shelf); done(); },
  newShelf: d => openSheet({ type: 'newShelf', name: '', book: d.id || null }),
  createShelf: () => {
    const name = (UI.sheet.name || '').trim();
    if (!name) { toast('Give the shelf a name first'); return; }
    const id = createShelf(name);
    if (UI.sheet.book) toggleShelf(UI.sheet.book, id);
    UI.sheet = null;
    done(`Created the shelf "${name}"`);
  },
  booksView: d => { UI.booksView = d.v; render(); },
  booksShelf: d => { UI.booksShelf = UI.booksShelf === d.id ? null : d.id; render(); },
  sort: d => { UI.booksSort = d.v; UI.sheet = null; render(); },

  /* Physical copies */
  toggleLend: d => {
    const c = copyById(d.id);
    if (activeLoan(c.id)) { toast('This copy has an open request or loan, so lending can\'t change right now'); return; }
    const on = toggleLendable(d.id);
    done(on ? `${BOOKS[c.book].title} is now available to lend` : `${BOOKS[c.book].title} is no longer offered`);
  },
  addCopy: d => {
    if (!S.library[d.id]) ensureEntry(d.id).status = null; // in My Books, with no reading status yet
    addMyCopy(d.id, false);
    done('Added your physical copy. Turn on lending when you\'re ready.');
  },

  /* Borrowing */
  requestBorrow: d => {
    const copyId = d.copy || (availableCopies(d.id)[0] || {}).id;
    if (!copyId) { toast('No copies are available right now'); return; }
    const copy = copyById(copyId);
    openSheet({ type: 'request', book: copy.book, copy: copyId, weeks: 2, pickup: 'library',
      message: `Hi ${PEOPLE[copy.owner].first}! Could I borrow ${BOOKS[copy.book].title}? I can pick it up this weekend.` });
  },
  sheetSet: d => {
    const sh = UI.sheet;
    if (sh.type === 'request' && d.k === 'copy') {
      // Keep the greeting in the message in step with the owner you picked.
      const from = PEOPLE[copyById(sh.copy).owner].first, to = PEOPLE[copyById(d.v).owner].first;
      sh.message = (sh.message || '').replace(new RegExp(`^Hi ${from}!`), `Hi ${to}!`);
    }
    sh[d.k] = /^\d+$/.test(d.v) ? +d.v : d.v;
    render();
  },
  submitRequest: () => {
    const sh = UI.sheet;
    const msg = (sh.message || '').trim() || `Hi! Could I borrow ${BOOKS[sh.book].title}?`;
    const { convo } = requestBorrow(sh.copy, { weeks: sh.weeks, pickup: sh.pickup, message: msg });
    UI.sheet = null;
    done('Request sent', { label: 'Open chat', act: 'openChat', id: convo.id });
  },
  cancelRequest: d => { cancelRequest(d.id); done('Request cancelled'); },
  respond: d => {
    const yes = d.v === 'yes';
    const { loan } = respondToLoan(d.id, yes);
    const copy = copyById(loan.copy);
    const who = copy.owner === 'me' ? PEOPLE[loan.borrower].first : PEOPLE[copy.owner].first;
    const text = copy.owner === 'me'
      ? (yes ? `You lent ${BOOKS[copy.book].title} to ${who}. Due back ${shortDate(loan.due)}.` : `You declined ${who}'s request`)
      : (yes ? `Simulated: ${who} accepted. Due back ${shortDate(loan.due)}.` : `Simulated: ${who} declined`);
    done(text);
  },
  returned: d => { markReturned(d.id); done('Marked as returned. The copy is available again.'); },

  /* Friends */
  selFriend: d => { UI.selFriend = d.id; UI.hscroll['friend-shared'] = 0; render(); },
  acceptFriend: d => { const id = acceptFriend(d.id); UI.selFriend = id; done(`You and ${PEOPLE[id].first} are now friends`); },
  declineFriend: d => { const id = declineFriend(d.id); done(`Declined ${PEOPLE[id].first}'s request`); },
  addFriend: d => { sendFriendRequest(d.id); done(`Friend request saved for ${PEOPLE[d.id].first}. No one is notified in this prototype.`); },
  cancelFriend: d => { cancelFriendRequest(d.id); done('Friend request withdrawn'); },
  readingSheet: d => openSheet({ type: 'reading', person: d.id }),

  /* Messages */
  send: d => {
    const field = document.getElementById('composer');
    const text = (field ? field.value : UI.drafts[d.id] || '').trim();
    if (!text) return;
    UI.drafts[d.id] = '';
    sendMessage(d.id, text);
    save();
    render();
    const f = document.getElementById('composer');
    if (f) f.focus({ preventScroll: true });
  },
  expandMsgs: () => { UI.msgsExpanded = !UI.msgsExpanded; render(); },
  newChatToggle: d => {
    const sel = UI.sheet.sel;
    UI.sheet.sel = sel.includes(d.id) ? sel.filter(x => x !== d.id) : [...sel, d.id];
    render();
  },
  newChatStart: () => {
    const { sel, name } = UI.sheet;
    if (!sel.length) { toast('Pick at least one friend'); return; }
    const c = sel.length === 1 ? dmWith(sel[0]) : startGroup(sel, (name || '').trim());
    openChat(c.id);
  },

  /* Map */
  mapArea: d => { UI.mapArea = d.id; UI.mapOwner = null; render(); },
  mapAvail: () => { UI.mapAvailOnly = !UI.mapAvailOnly; render(); },
  mapOwner: d => { UI.mapOwner = d.id; UI.mapBook = null; render(); },
  mapBook: d => { UI.mapBook = d.id; render(); },
  mapClose: () => { UI.mapOwner = null; render(); },

  /* Add a book */
  addBook: () => openSheet({ type: 'addBook', q: '', pick: null, status: 'want', own: false, lend: false, shelves: [], manual: false, title: '', author: '' }),
  addBookPick: d => { UI.sheet.pick = d.id; UI.sheet.own = !!myCopy(d.id); render(); },
  addBookManual: () => { UI.sheet.manual = true; UI.sheet.pick = null; render(); },
  addBookToggle: d => {
    const sh = UI.sheet;
    if (d.k === 'own') { sh.own = !sh.own; if (!sh.own) sh.lend = false; }
    if (d.k === 'lend') { sh.lend = !sh.lend; if (sh.lend) sh.own = true; }
    if (d.k === 'shelf') sh.shelves = sh.shelves.includes(d.v) ? sh.shelves.filter(x => x !== d.v) : [...sh.shelves, d.v];
    render();
  },
  addBookSave: () => {
    const sh = UI.sheet;
    let id = sh.pick;
    if (sh.manual) {
      if (!sh.title.trim()) { toast('Add a title first'); return; }
      id = addCustomBook(sh.title.trim(), sh.author.trim());
    }
    if (!id) return;
    const e = ensureEntry(id);
    e.status = sh.status;
    e.shelves = [...new Set([...e.shelves, ...sh.shelves])];
    if (sh.own) addMyCopy(id, sh.lend);
    if (sh.own && sh.lend) myCopy(id).lendable = true;
    UI.sheet = null;
    done(`Added ${BOOKS[id].title} to My Books`, { label: 'View', act: 'openBook', id });
  },

  /* Prototype helpers (notes panel and info sheet) */
  reset: () => {
    resetDemo();
    Object.assign(UI, { tab: 'home', stacks: freshStacks(), sheet: null, drafts: {}, hscroll: {}, mapOwner: null, mapArea: 'all', booksShelf: null, selFriend: 'maya' });
    for (const k of Object.keys(UI.q)) UI.q[k] = '';
    UI.anim = 'fade';
    render();
    toast('Demo data reset');
  },
  demo: d => {
    UI.sheet = null;
    if (d.id === 'borrow') { UI.tab = 'home'; UI.stacks.home = [UI.stacks.home[0], entry('book', { id: 'inherit' })]; UI.anim = 'push'; render(); }
    if (d.id === 'owner') { const c = dmWith('priya'); openChat(c.id); }
    if (d.id === 'lend') { UI.tab = 'friends'; UI.stacks.friends = [UI.stacks.friends[0]]; UI.anim = 'fade'; render(); const r = document.getElementById('requests'); if (r) r.scrollIntoView({ block: 'start' }); }
    if (d.id === 'map') switchTab('map');
  },
};

/* ---------- Event wiring ---------- */

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !el.closest('.device, .notes')) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.q) { UI.q[el.dataset.q] = el.value; if (el.dataset.q === 'map') UI.mapOwner = null; render(); return; }
  if (el.dataset.draft) {
    UI.drafts[el.dataset.draft] = el.value;
    const btn = document.querySelector('.composer .send');
    if (btn) btn.disabled = !el.value.trim();
    return;
  }
  if (el.dataset.field && UI.sheet) {
    UI.sheet[el.dataset.field] = el.value;
    if (UI.sheet.type === 'addBook' && el.dataset.field === 'q') searchBookDb(el.value);
    if (el.dataset.live) render();
  }
});

document.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Enter' && el.dataset && el.dataset.draft) { e.preventDefault(); ACT.send({ id: el.dataset.draft }); }
  if (e.key === 'Enter' && el.dataset && el.dataset.enter) { e.preventDefault(); ACT[el.dataset.enter]({}); }
  if (e.key === 'Escape' && UI.sheet) closeSheet();
});

/* Fake status-bar clock for the desktop phone frame. */
function tickClock() {
  const el = document.getElementById('sb-time');
  if (el) el.textContent = clockTime(Date.now()).replace(/ [AP]M$/, '');
}

document.addEventListener('DOMContentLoaded', () => {
  render();
  tickClock();
  setInterval(tickClock, 20000);
});

</script>
<script>
/* Shelfmates prototype: Home, My Books and Book Details screens, plus shared screen pieces. */

const SCREENS = {};

/* ---------- Shared pieces ---------- */

function logo() {
  return `<svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="6" width="6" height="21" rx="1.5" class="lg1"/><rect x="11" y="3" width="6" height="24" rx="1.5" class="lg2"/><path d="m19.5 8.6 5.6-1.5 5 18.6-5.6 1.5z" class="lg3"/><path d="M2 28.5h28" class="lg4"/></svg>`;
}
function searchBar(key, placeholder) {
  const v = UI.q[key];
  return `<label class="search">${icon('search')}<span class="sr">${esc(placeholder)}</span>` +
    `<input id="q-${key}" data-q="${key}" type="search" placeholder="${esc(placeholder)}" value="${esc(v)}" autocomplete="off" spellcheck="false">` +
    (v ? `<button type="button" class="clear" data-act="clearQ" data-id="${key}" aria-label="Clear search">${icon('close')}</button>` : '') + '</label>';
}
function pageHead(title, action) {
  return `<header class="page-head pad"><h1>${esc(title)}</h1>${action || ''}</header>`;
}
function topbar(title, right) {
  return `<header class="topbar"><button type="button" class="icon-btn" data-act="back" aria-label="Back">${icon('back')}</button>` +
    `<div class="topbar-title">${title || ''}</div>${right || '<span class="icon-btn ghost"></span>'}</header>`;
}
function sectionHead(title, sub, action) {
  return `<div class="sec-head pad"><div><h2>${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ''}</div>${action || ''}</div>`;
}
function rail(key, items, cls = '') {
  return `<div class="rail-wrap"><div class="rail ${cls}" data-hscroll="${key}">${items}</div><div class="dots" aria-hidden="true"></div></div>`;
}
function empty(title, text, action) {
  return `<div class="empty">${icon('shelf')}<strong>${esc(title)}</strong><p>${esc(text)}</p>${action || ''}</div>`;
}
function availabilityLine(bookId) {
  const mineLoan = myOpenLoanFor(bookId);
  if (mineLoan && mineLoan.status === 'pending') return '<span class="tline t-pending">Request pending</span>';
  const n = availableCopies(bookId).length;
  return n ? `<span class="tline t-available"><i class="dot"></i>${plural(n, 'copy', 'copies')} with friends</span>` : '<span class="tline t-muted">None free right now</span>';
}
function bookRow(id, extra) {
  const b = BOOKS[id];
  return `<button type="button" class="result" data-act="openBook" data-id="${id}">${cover(id, 'xs')}` +
    `<span class="result-text"><strong>${esc(b.title)}</strong><span>${esc(b.author)} · ${esc(b.genre)}</span>${extra || ''}</span>${icon('chev', 'muted')}</button>`;
}
function personRow(id) {
  const p = PEOPLE[id];
  const rel = relation(id);
  const tag = rel === 'friend' ? '<span class="tag">Friend</span>' : rel === 'sent' ? '<span class="tag">Requested</span>' : rel === 'incoming' ? '<span class="tag">Wants to connect</span>' : '';
  return `<button type="button" class="result" data-act="openPerson" data-id="${id}">${avatar(id, 44)}` +
    `<span class="result-text"><strong>${esc(p.name)}</strong><span>${esc(HOODS[p.hood].name)} ${tag}</span></span>${icon('chev', 'muted')}</button>`;
}

/* ---------- Home ---------- */

const GENRES = ['Mystery', 'Fantasy', 'Dystopian', 'Romantasy', 'Sci-fi', 'Thriller'];

SCREENS.home = () => {
  const q = UI.q.home;
  const hr = new Date().getHours();
  const greet = hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
  const inc = incomingRequests();
  let content;
  if (q.trim()) {
    const books = searchBooks(q), people = searchPeople(q);
    content = (books.length ? `<div class="pad group-label">Books</div><div class="pad list">${books.map(b => bookRow(b.id, availabilityLine(b.id))).join('')}</div>` : '') +
      (people.length ? `<div class="pad group-label">People</div><div class="pad list">${people.map(p => personRow(p.id)).join('')}</div>` : '') +
      (!books.length && !people.length ? empty(`None of your friends have "${q.trim()}"`, 'Try a title, an author, or a genre like Mystery. You can still add any book to your shelf.') : '') +
      `<div class="pad"><button type="button" class="btn ghost full" data-act="searchDb">${icon('search')} Search the full book database</button></div>`;
  } else {
    const yours = yourBooks().map(it => `<button type="button" class="tile" data-act="openBook" data-id="${it.book}">` +
      `<span class="tile-cover">${cover(it.book)}${it.tone === 'borrowed' ? stamp(it.due) : ''}</span>` +
      `<span class="tile-title">${esc(BOOKS[it.book].title)}</span><span class="tline t-${it.tone}">${esc(it.line)}</span></button>`).join('');
    const disc = discoverBooks().map(id => `<button type="button" class="tile" data-act="openBook" data-id="${id}">` +
      `<span class="tile-cover">${cover(id)}</span><span class="tile-title">${esc(BOOKS[id].title)}</span>` +
      `<span class="tile-sub">${esc(BOOKS[id].author)}</span>${availabilityLine(id)}</button>`).join('');
    content =
      (inc.length ? `<div class="pad"><button type="button" class="notice" data-act="demo" data-id="lend">${avatar(inc[0].borrower, 40)}` +
        `<span><strong>${esc(PEOPLE[inc[0].borrower].first)} wants to borrow ${esc(BOOKS[copyById(inc[0].copy).book].title)}</strong>` +
        `<span>${inc.length > 1 ? `${plural(inc.length, 'request')} waiting` : 'Review the request'}</span></span>${icon('chev')}</button></div>` : '') +
      `<section class="sec">${sectionHead('Your Books', 'Borrowed, lent and on the go', `<button type="button" class="link" data-act="tab" data-id="books">See all</button>`)}${rail('home-yours', yours)}</section>` +
      `<section class="sec">${sectionHead(friendsShareTitle(), friendsShareSub())}${rail('home-discover', disc)}</section>` +
      `<section class="sec">${sectionHead('Browse by genre')}<div class="chips pad">${GENRES.map(g => `<button type="button" class="pill" data-act="genre" data-id="${g}">${g}</button>`).join('')}</div></section>`;
  }
  return `<div class="body">
    <header class="home-head pad"><div class="brand">${logo()}<span>Shelfmates</span></div>
      <button type="button" class="icon-btn" data-act="openSheet" data-id="info" aria-label="About this prototype">${icon('info')}</button></header>
    <h1 class="greet pad">${greet}, Sam</h1>
    <div class="pad search-row">${searchBar('home', 'Books, authors, genres')}</div>
    ${content}
  </div>`;
};
ACT.genre = d => { UI.q.home = d.id; render(); };

/* ---------- My Books ---------- */

const SORTS = { recent: 'Recently added', title: 'Title', author: 'Author', rating: 'My rating' };

function sortedLibrary(ids) {
  const by = {
    recent: (a, b) => S.library[b].added - S.library[a].added,
    title: (a, b) => BOOKS[a].title.replace(/^(The|A) /, '').localeCompare(BOOKS[b].title.replace(/^(The|A) /, '')),
    author: (a, b) => BOOKS[a].author.split(' ').pop().localeCompare(BOOKS[b].author.split(' ').pop()),
    rating: (a, b) => S.library[b].rating - S.library[a].rating,
  }[UI.booksSort];
  return ids.filter(id => S.library[id]).sort(by);
}

function lendControl(copy) {
  const st = copyState(copy);
  const busy = st.code === 'pending' || st.code === 'borrowed';
  return `<div class="lend-line">${copyChip(st.code, copyLabel(copy, st))}` +
    (busy ? '' : `<button type="button" class="switch sm" role="switch" aria-checked="${copy.lendable}" data-act="toggleLend" data-id="${copy.id}" aria-label="Available to lend"><i></i></button>`) + '</div>';
}

function libraryRow(id) {
  const b = BOOKS[id], e = S.library[id], c = myCopy(id);
  return `<article class="row">
    <button type="button" class="row-cover" data-act="openBook" data-id="${id}" tabindex="-1" aria-hidden="true">${cover(id)}</button>
    <div class="row-info">
      <button type="button" class="row-title" data-act="openBook" data-id="${id}"><strong>${esc(b.title)}</strong><span>${esc(b.author)}</span></button>
      ${stars(e.rating, { book: id, size: 18 })}
      <div class="row-chips">${readChip(e.status, e.fav)}</div>
      ${c ? lendControl(c) : ''}
    </div></article>`;
}

function libraryGridItem(id) {
  const e = S.library[id];
  return `<button type="button" class="grid-item" data-act="openBook" data-id="${id}">${cover(id)}` +
    `<span class="tile-title">${esc(BOOKS[id].title)}</span><span class="tile-sub">${e.rating ? stars(e.rating, { size: 11 }) : READ_LABEL[e.status] || 'No status yet'}</span></button>`;
}

SCREENS.books = () => {
  const q = UI.q.books.trim().toLowerCase();
  const cols = collections();
  const active = cols.find(c => c.id === UI.booksShelf);
  let ids = active ? active.books : Object.keys(S.library);
  if (q) ids = Object.keys(S.library).filter(id => `${BOOKS[id].title} ${BOOKS[id].author} ${BOOKS[id].genre}`.toLowerCase().includes(q));
  ids = sortedLibrary([...new Set(ids)]);

  const colCards = cols.map(c => `<button type="button" class="col-card${UI.booksShelf === c.id ? ' on' : ''}" data-act="booksShelf" data-id="${c.id}" aria-pressed="${UI.booksShelf === c.id}">` +
    `<span class="col-fan">${c.books.slice(0, 3).map(id => cover(id)).join('') || `<span class="col-empty">${icon('shelf')}</span>`}</span>` +
    `<span class="col-name">${c.physical ? icon('swap', 'col-ic') : c.id === 'fav' ? icon('heart', 'col-ic') : ''}${esc(c.name)}</span><span class="col-count">${plural(c.books.length, 'book')}</span></button>`).join('') +
    `<button type="button" class="col-card new" data-act="newShelf"><span class="col-fan"><span class="col-empty">${icon('plus')}</span></span><span class="col-name">New shelf</span><span class="col-count">Make your own</span></button>`;

  const listTitle = q ? `Results for "${UI.q.books.trim()}"` : active ? active.name : 'All Books';
  const tools = `<div class="tools">
    <button type="button" class="icon-btn" data-act="openSheet" data-id="sort" aria-label="Sort: ${SORTS[UI.booksSort]}">${icon('filter')}</button>
    <div class="seg mini" role="group" aria-label="Layout">
      <button type="button" data-act="booksView" data-v="list" aria-pressed="${UI.booksView === 'list'}" aria-label="List view">${icon('list')}</button>
      <button type="button" data-act="booksView" data-v="grid" aria-pressed="${UI.booksView === 'grid'}" aria-label="Grid view">${icon('grid')}</button>
    </div></div>`;

  const items = !ids.length
    ? empty(q ? 'Nothing on your shelf matches' : 'No books here yet', q ? 'Search Home to find books from the community.' : 'Add a book with the + button, or set a status on any book page.')
    : UI.booksView === 'grid' ? `<div class="grid pad">${ids.map(libraryGridItem).join('')}</div>` : `<div class="rows pad">${ids.map(libraryRow).join('')}</div>`;

  return `<div class="body">
    ${pageHead('My Books', `<button type="button" class="icon-btn solid" data-act="addBook" aria-label="Add a book">${icon('plus')}</button>`)}
    <div class="pad search-row">${searchBar('books', 'Search my books…')}</div>
    ${q ? '' : `<section class="sec">${sectionHead('My Collections')}${rail('books-cols', colCards, 'cols')}</section>`}
    <section class="sec">
      <div class="sec-head pad"><div><h2>${esc(listTitle)}</h2><p>${plural(ids.length, 'book')} · ${SORTS[UI.booksSort]}</p></div>${tools}</div>
      ${active && !q ? `<div class="pad"><button type="button" class="pill on" data-act="booksShelf" data-id="${active.id}">${esc(active.name)} ${icon('close')}</button></div>` : ''}
      ${items}
    </section>
  </div>`;
};

/* ---------- Book details ---------- */

function borrowButton(id) {
  if (myCopy(id)) return `<span class="btn ghost static">${icon('check')} You own a copy</span>`;
  const loan = myOpenLoanFor(id);
  if (loan) {
    const convo = dmWith(copyById(loan.copy).owner).id;
    return loan.status === 'accepted'
      ? `<button type="button" class="btn ghost" data-act="openChat" data-id="${convo}">${icon('swap')} Borrowing · ${esc(dueText(loan.due))}</button>`
      : `<button type="button" class="btn ghost" data-act="openChat" data-id="${convo}">${icon('clock')} Request pending</button>`;
  }
  if (availableCopies(id).length) return `<button type="button" class="btn primary" data-act="requestBorrow" data-id="${id}">${icon('swap')} Request to borrow</button>`;
  return `<span class="btn ghost static">${otherCopies(id).length ? 'No copies free right now' : 'No friends have a copy yet'}</span>`;
}

function shelfCard(id) {
  const e = S.library[id];
  if (!e) return ''; // the "Add to my shelf" button above covers this case
  const opt = (v, label) => `<button type="button" class="opt" data-act="setStatus" data-id="${id}" data-v="${v}" aria-pressed="${e.status === v}">${label}</button>`;
  return `<section class="card pad-card"><div class="card-head"><h2>${icon('bookmark')} Your reading shelf</h2>
      <button type="button" class="link danger" data-act="removeFromShelf" data-id="${id}">Remove</button></div>
    <div class="field-label">Reading status</div>
    <div class="opts" role="group" aria-label="Reading status">${opt('want', 'Want to Read')}${opt('reading', 'Currently Reading')}${opt('finished', 'Finished')}
      <button type="button" class="opt fav" data-act="fav" data-id="${id}" aria-pressed="${e.fav}">${icon('heart')} Favorites</button></div>
    <div class="field-label">Your rating</div>${stars(e.rating, { book: id, size: 28 })}
    <div class="field-label">Shelves</div>
    <div class="chips">${S.shelves.map(s => `<button type="button" class="pill" data-act="toggleShelf" data-id="${id}" data-shelf="${s.id}" aria-pressed="${e.shelves.includes(s.id)}">${e.shelves.includes(s.id) ? icon('check') : ''}${esc(s.name)}</button>`).join('')}
      <button type="button" class="pill dashed" data-act="newShelf" data-id="${id}">${icon('plus')} New shelf</button></div>
  </section>`;
}

function myCopyCard(id) {
  const c = myCopy(id);
  if (!c) {
    return `<section class="card pad-card quiet"><div class="card-head"><h2>${icon('swap')} Own a physical copy?</h2></div>
      <p class="muted">Add it so friends can ask to borrow it. You approve every request.</p>
      <button type="button" class="btn ghost full" data-act="addCopy" data-id="${id}">${icon('plus')} I own this book</button></section>`;
  }
  const st = copyState(c);
  let loanPart = '';
  if (st.code === 'pending') {
    loanPart = `<div class="loan-box">${avatar(st.loan.borrower, 36)}<div><strong>${esc(PEOPLE[st.loan.borrower].name)} asked to borrow it</strong><span>${st.loan.weeks} weeks · ${esc(PICKUPS[st.loan.pickup])}</span></div></div>
      <div class="btn-row"><button type="button" class="btn primary" data-act="respond" data-id="${st.loan.id}" data-v="yes">Accept</button><button type="button" class="btn ghost" data-act="respond" data-id="${st.loan.id}" data-v="no">Decline</button></div>`;
  } else if (st.code === 'borrowed') {
    loanPart = `<div class="loan-box">${avatar(st.loan.borrower, 36)}<div><strong>Lent to ${esc(PEOPLE[st.loan.borrower].name)}</strong><span>${esc(dueText(st.loan.due))}</span></div>${stamp(st.loan.due)}</div>
      <button type="button" class="btn ghost full" data-act="returned" data-id="${st.loan.id}">${icon('check')} Mark as returned</button>`;
  }
  return `<section class="card pad-card"><div class="card-head"><h2>${icon('swap')} Your physical copy</h2>${copyChip(st.code, copyLabel(c, st))}</div>
    ${st.code === 'pending' || st.code === 'borrowed' ? '' : `<div class="switch-row"><div><strong>Available to lend</strong><span>${c.lendable ? 'Neighbors can send you a request.' : esc(c.note || 'Only you can see this copy.')}</span></div>
      <button type="button" class="switch" role="switch" aria-checked="${c.lendable}" data-act="toggleLend" data-id="${c.id}" aria-label="Available to lend"><i></i></button></div>`}
    ${loanPart}<p class="muted small">Condition: ${esc(c.cond)}</p><div class="btn-row"><button type="button" class="btn ghost" data-act="editCopy" data-id="${c.id}">Edit details</button>${st.code === 'pending' || st.code === 'borrowed' ? '' : `<button type="button" class="btn ghost" data-act="removeCopy" data-id="${c.id}">Remove copy</button>`}</div></section>`;
}

function ownerCard(c, myLoan) {
  const st = copyState(c);
  const p = PEOPLE[c.owner];
  let action = '';
  if (st.loan && st.loan.borrower === 'me' && st.code === 'pending') action = `<button type="button" class="btn sm ghost" data-act="cancelRequest" data-id="${st.loan.id}">Cancel</button>`;
  else if (st.code === 'available' && !myLoan && !myCopy(c.book)) action = `<button type="button" class="btn sm primary" data-act="requestBorrow" data-id="${c.book}" data-copy="${c.id}">Request</button>`;
  const label = st.loan && st.loan.borrower === 'me' ? (st.code === 'pending' ? 'Your request is pending' : `You're borrowing · ${dueText(st.loan.due)}`) : (c.note && st.code === 'unavailable' ? c.note : copyLabel(c, st));
  return `<div class="owner-card"><button type="button" class="owner-open" data-act="openPerson" data-id="${c.owner}">${avatar(c.owner, 44)}
      <span class="owner-text"><strong>${esc(p.name)}${isFriend(c.owner) ? ' <span class="tag">Friend</span>' : ''}</strong>
      <span>${esc(HOODS[p.hood].name)} · ${distance(c.owner)} · ${esc(c.cond)}</span>${copyChip(st.code, label)}</span></button>${action}</div>`;
}

SCREENS.book = ({ id }) => {
  const b = BOOKS[id];
  const others = otherCopies(id);
  const avail = others.filter(c => copyState(c).code === 'available').length;
  const myLoan = myOpenLoanFor(id);
  const [bg, bg2] = b.cover.c;
  return `<div class="book-screen" style="--cb:${bg};--cb2:${bg2}">${topbar('')}
  <div class="body has-topbar">
    <section class="book-hero">
      <div class="hero-cover">${cover(id)}</div>
      <div class="hero-info">
        <h1 class="book-title">${esc(b.title)}</h1>
        <p class="book-author">${esc(b.author)}</p>
        ${b.ratings ? `<div class="rating-line">${stars(b.rating, { size: 15 })}<span>${b.rating.toFixed(1)} · ${b.ratings} reader ratings</span></div>` : ''}
        <p class="book-meta">${esc([b.genre, b.year].filter(Boolean).join(' · '))}</p>
      </div>
    </section>
    <div class="cta-row pad">
      ${S.library[id] ? `<span class="btn soft static">${icon('check')} ${READ_LABEL[S.library[id].status] || 'In My Books'}</span>` : `<button type="button" class="btn soft" data-act="addToShelf" data-id="${id}">${icon('bookmark')} Add to my shelf</button>`}
      ${borrowButton(id)}
    </div>
    <p class="cta-note pad">Your shelf is your personal reading list. Borrowing asks a friend for their physical copy.</p>
    <section class="pad prose"><h2>About this book</h2><p>${esc(b.desc)}</p></section>
    <div class="pad stack">${shelfCard(id)}${myCopyCard(id)}</div>
    <section class="sec" id="copies">
      ${sectionHead('Borrow a physical copy', others.length ? `${plural(avail, 'copy', 'copies')} available from friends · locations are approximate` : 'None of your friends have listed this book yet')}
      <div class="pad list">${others.map(c => ownerCard(c, myLoan)).join('')}</div>
    </section>
  </div></div>`;
};

</script>
<script>
/* Shelfmates prototype: Friends, profiles, Map, Messages and chat screens. */

/* ---------- Friends ---------- */

function sharedTile(c) {
  const st = copyState(c);
  const b = BOOKS[c.book];
  const canAsk = st.code === 'available' && !myOpenLoanFor(c.book) && !myCopy(c.book);
  return `<div class="tile">
    <button type="button" class="tile-open" data-act="openBook" data-id="${c.book}"><span class="tile-cover">${cover(c.book)}</span>
      <span class="tile-title">${esc(b.title)}</span></button>
    ${copyChip(st.code, st.loan && st.loan.borrower === 'me' ? (st.code === 'pending' ? 'You asked' : 'With you') : COPY_LABEL[st.code])}
    ${canAsk ? `<button type="button" class="btn xs primary" data-act="requestBorrow" data-id="${c.book}" data-copy="${c.id}">Request</button>` : ''}
  </div>`;
}

function bookRequestCard(l) {
  const c = copyById(l.copy);
  const b = BOOKS[c.book];
  return `<article class="req-card">
    <button type="button" class="req-cover" data-act="openBook" data-id="${c.book}" aria-label="Open ${esc(b.title)}">${cover(c.book)}</button>
    <div class="req-text"><span class="req-kicker">${avatar(l.borrower, 22)} ${esc(PEOPLE[l.borrower].first)} wants to borrow</span>
      <strong>${esc(b.title)}</strong><span>${esc(b.author)}</span><span class="muted small">${l.weeks} weeks · ${esc(PICKUPS[l.pickup])}</span>
      <div class="btn-row"><button type="button" class="btn sm primary" data-act="respond" data-id="${l.id}" data-v="yes">Accept</button>
        <button type="button" class="btn sm ghost" data-act="respond" data-id="${l.id}" data-v="no">Decline</button></div></div>
  </article>`;
}

function friendRequestCard(r) {
  const p = PEOPLE[r.from];
  return `<article class="req-card person">
    <button type="button" class="req-av" data-act="openPerson" data-id="${r.from}" aria-label="Open ${esc(p.name)}">${avatar(r.from, 52)}</button>
    <div class="req-text"><strong>${esc(p.name)}</strong><span>${esc(r.note)}</span>
      <span class="muted small">${plural(MUTUALS[r.from] || 0, 'mutual friend')} · ${esc(HOODS[p.hood].name)}</span>
      <div class="btn-row"><button type="button" class="btn sm primary" data-act="acceptFriend" data-id="${r.id}">Accept</button>
        <button type="button" class="btn sm ghost" data-act="declineFriend" data-id="${r.id}">Decline</button></div></div>
  </article>`;
}

function peopleResults(q) {
  const found = searchPeople(q);
  if (!found.length) return empty(`No one named "${q}"`, 'Check the spelling, or invite friends from the + button.');
  const friends = found.filter(p => isFriend(p.id)), others = found.filter(p => !isFriend(p.id));
  const addBtn = id => {
    const rel = relation(id);
    if (rel === 'sent') return `<button type="button" class="btn xs ghost" data-act="cancelFriend" data-id="${id}">Requested</button>`;
    if (rel === 'incoming') return `<button type="button" class="btn xs ghost" data-act="demo" data-id="lend">Respond</button>`;
    return `<button type="button" class="btn xs primary" data-act="addFriend" data-id="${id}">${icon('userplus')} Add</button>`;
  };
  return (friends.length ? `<div class="pad group-label">Friends</div><div class="pad list">${friends.map(p => personRow(p.id)).join('')}</div>` : '') +
    (others.length ? `<div class="pad group-label">More readers</div><div class="pad list">${others.map(p =>
      `<div class="result-wrap">${personRow(p.id)}${addBtn(p.id)}</div>`).join('')}</div>` : '');
}

SCREENS.friends = () => {
  const q = UI.q.friends.trim();
  if (!isFriend(UI.selFriend)) UI.selFriend = S.friends[0];
  const sel = UI.selFriend;
  const shared = sel ? sharedBy(sel) : [];
  const availN = shared.filter(c => copyState(c).code === 'available').length;
  const inc = incomingRequests();
  const avs = S.friends.map(id => `<button type="button" class="friend-av${id === sel ? ' on' : ''}" data-act="selFriend" data-id="${id}" aria-pressed="${id === sel}">` +
    `${avatar(id, 60)}<span>${esc(PEOPLE[id].first)}</span></button>`).join('');
  const body = q ? peopleResults(q) : `
    <section class="sec">${rail('friend-avs', avs, 'avs')}</section>
    ${sel ? `<section class="sec">${sectionHead(`Books ${PEOPLE[sel].first} is sharing`, `${plural(availN, 'book')} available · ${HOODS[PEOPLE[sel].hood].name}`,
      `<button type="button" class="link" data-act="openPerson" data-id="${sel}">View all</button>`)}
      ${shared.length ? rail('friend-shared', shared.map(sharedTile).join('')) : `<p class="pad muted">${esc(PEOPLE[sel].first)} hasn't listed any books yet.</p>`}</section>` : ''}
    <section class="sec" id="requests">${sectionHead('Requests', inc.length + S.friendRequests.length ? 'Waiting for your answer' : 'You are all caught up')}
      <div class="pad stack">
        ${inc.length ? `<div class="group-label">Book requests</div>${inc.map(bookRequestCard).join('')}` : ''}
        ${S.friendRequests.length ? `<div class="group-label">Friend requests</div>${S.friendRequests.map(friendRequestCard).join('')}` : ''}
      </div></section>`;
  return `<div class="body">
    ${pageHead('Your Friends', `<button type="button" class="icon-btn solid" data-act="openSheet" data-id="addFriend" aria-label="Add friends">${icon('userplus')}</button>`)}
    <div class="pad search-row">${searchBar('friends', 'Search people')}</div>
    ${body}
  </div>`;
};

/* ---------- Profile ---------- */

SCREENS.person = ({ id }) => {
  const p = PEOPLE[id];
  const rel = relation(id);
  const copies = sharedBy(id);
  const avail = copies.filter(c => copyState(c).code === 'available').length;
  const relBtn = {
    friend: `<span class="btn soft static">${icon('check')} Friends</span>`,
    sent: `<button type="button" class="btn ghost" data-act="cancelFriend" data-id="${id}">Requested · Withdraw</button>`,
    incoming: `<button type="button" class="btn primary" data-act="demo" data-id="lend">Respond to request</button>`,
    none: `<button type="button" class="btn primary" data-act="addFriend" data-id="${id}">${icon('userplus')} Add friend</button>`,
  }[rel];
  const grid = copies.map(c => {
    const st = copyState(c);
    const canAsk = st.code === 'available' && !myOpenLoanFor(c.book) && !myCopy(c.book);
    return `<div class="grid-item"><button type="button" class="tile-open" data-act="openBook" data-id="${c.book}">${cover(c.book)}<span class="tile-title">${esc(BOOKS[c.book].title)}</span></button>
      ${copyChip(st.code, st.loan && st.loan.borrower === 'me' ? (st.code === 'pending' ? 'You asked' : 'With you') : COPY_LABEL[st.code])}
      ${canAsk ? `<button type="button" class="btn xs primary" data-act="requestBorrow" data-id="${c.book}" data-copy="${c.id}">Request</button>` : ''}</div>`;
  }).join('');
  return `${topbar(esc(p.first))}
  <div class="body has-topbar">
    <section class="profile pad">
      ${avatar(id, 88, 'big')}
      <h1>${esc(p.name)}</h1>
      <p class="muted">${icon('pin', 'inline')} ${esc(HOODS[p.hood].name)} · approximate area</p>
      ${p.bio ? `<p class="bio">${esc(p.bio)}</p>` : ''}
      <div class="btn-row center">${rel === 'friend' ? `<button type="button" class="btn primary" data-act="chatWith" data-id="${id}">${icon('chat')} Message</button>` : ''}${relBtn}</div>
      <dl class="stats"><div><dt>Sharing</dt><dd>${copies.length}</dd></div><div><dt>Available</dt><dd>${avail}</dd></div><div><dt>Distance</dt><dd>${distance(id).replace('about ', '~')}</dd></div></dl>
    </section>
    ${p.reading ? `<section class="sec">${sectionHead('Reading now')}<div class="pad"><div class="now-card">
      <button type="button" class="now-open" data-act="openBook" data-id="${p.reading}">${cover(p.reading, 'sm')}<span><strong>${esc(BOOKS[p.reading].title)}</strong><span>${esc(BOOKS[p.reading].author)}</span></span></button>
      ${rel === 'friend' ? `<button type="button" class="btn sm ghost" data-act="chatWith" data-id="${id}" data-book="${p.reading}">Ask about it</button>` : ''}</div></div></section>` : ''}
    <section class="sec">${sectionHead(`${p.first}'s shared shelf`, copies.length ? 'Physical copies you can ask to borrow' : 'Nothing listed yet')}
      <div class="grid pad">${grid}</div></section>
  </div>`;
};

/* ---------- Map ---------- */

const HOOD_LABELS = { maple: [14, 5], college: [86, 11], river: [84, 91], old: [11, 96] };
const MAP_SVG = `<svg class="map-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
  <rect width="100" height="100" class="m-land"/>
  <path d="M41 37h17l2 13H43z" class="m-park"/><path d="M80 9h14v9H81z" class="m-park"/><path d="M6 86h12v10H6z" class="m-park"/>
  <g class="m-minor">
    <path d="M8 16H40M8 22H40M8 28H40M8 34H40M8 40H40M12 10V42M18 10V42M24 10V42M30 10V42M36 10V42"/>
    <path d="M8 58H42M8 64H42M8 70H42M8 76H42M8 82H42M8 88H42M14 54V94M20 54V94M26 54V94M32 54V94M38 54V94"/>
    <path d="M58 10H96M58 18H96M58 26H96M58 33H96M64 6V36M72 6V36M80 22V36M88 20V36"/>
    <path d="M62 56H96M64 64H96M66 72H96M68 80H96M74 54V92M82 52V92M90 52V92"/>
  </g>
  <path d="M104 36C88 40 74 43 66 48S54 58 53 66S58 88 60 104" class="m-water"/>
  <g class="m-main"><path d="M0 47H100"/><path d="M47 0V100"/><path d="M47 47 100 13"/><path d="M47 100 100 60"/></g>
</svg>`;

function mapOwners() {
  const q = UI.q.map.trim().toLowerCase();
  return Object.values(PEOPLE).filter(p => p.id !== 'me').map(p => {
    let cs = sharedBy(p.id);
    if (UI.mapAvailOnly) cs = cs.filter(c => copyState(c).code === 'available' || (copyState(c).loan || {}).borrower === 'me');
    if (q) cs = cs.filter(c => `${BOOKS[c.book].title} ${BOOKS[c.book].author} ${p.name}`.toLowerCase().includes(q));
    if (UI.mapArea !== 'all' && p.hood !== UI.mapArea) cs = [];
    return { p, cs };
  }).filter(o => o.cs.length);
}

function mapSheet(o) {
  const c = o.cs.find(x => x.book === UI.mapBook) || o.cs[0];
  const st = copyState(c);
  const b = BOOKS[c.book];
  const canAsk = st.code === 'available' && !myOpenLoanFor(c.book) && !myCopy(c.book);
  const mine = st.loan && st.loan.borrower === 'me';
  return `<div class="map-sheet" role="dialog" aria-label="${esc(b.title)} from ${esc(o.p.first)}">
    <div class="grabber" aria-hidden="true"></div>
    <button type="button" class="sheet-x" data-act="mapClose" aria-label="Close">${icon('xcircle')}</button>
    <div class="ms-main"><button type="button" class="ms-cover" data-act="openBook" data-id="${c.book}" aria-label="Open ${esc(b.title)}">${cover(c.book)}</button>
      <div class="ms-text"><strong class="ms-title">${esc(b.title)}</strong><span>${esc(b.author)}</span>
        <button type="button" class="ms-owner" data-act="openPerson" data-id="${o.p.id}">${avatar(o.p.id, 22)} ${esc(o.p.name)}${isFriend(o.p.id) ? ' <span class="tag">Friend</span>' : ''}</button>
        <span class="muted small">${esc(HOODS[o.p.hood].name)} · ${distance(o.p.id)} · approximate</span>
        ${copyChip(st.code, mine ? (st.code === 'pending' ? 'Your request is pending' : dueText(st.loan.due)) : COPY_LABEL[st.code])}</div></div>
    <div class="btn-row">${canAsk ? `<button type="button" class="btn primary" data-act="requestBorrow" data-id="${c.book}" data-copy="${c.id}">${icon('swap')} Request</button>` : ''}
      <button type="button" class="btn ghost" data-act="openBook" data-id="${c.book}">Book details</button></div>
    ${o.cs.length > 1 ? `<div class="ms-more"><span class="muted small">More from ${esc(o.p.first)}</span><div class="ms-more-row">${o.cs.map(x =>
      `<button type="button" class="ms-mini${x.id === c.id ? ' on' : ''}" data-act="mapBook" data-id="${x.book}" aria-label="${esc(BOOKS[x.book].title)}">${cover(x.book)}</button>`).join('')}</div></div>` : ''}
  </div>`;
}

SCREENS.map = () => {
  const owners = mapOwners();
  const total = owners.reduce((n, o) => n + o.cs.length, 0);
  const area = HOODS[UI.mapArea];
  const z = area ? 1.9 : 1;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const tx = area ? clamp(50 - area.x * z, (1 - z) * 100, 0) : 0;
  const ty = area ? clamp(50 - area.y * z, (1 - z) * 100, 0) : 0;
  const selected = owners.find(o => o.p.id === UI.mapOwner);
  const chips = [['all', 'All areas'], ...Object.entries(HOODS).map(([k, h]) => [k, h.name])].map(([k, label]) =>
    `<button type="button" class="pill${UI.mapArea === k ? ' on' : ''}" data-act="mapArea" data-id="${k}" aria-pressed="${UI.mapArea === k}">${esc(label)}</button>`).join('');
  const pins = owners.map(o => `<button type="button" class="pin${o.p.id === UI.mapOwner ? ' on' : ''}" style="left:${o.p.x}%;top:${o.p.y}%" data-act="mapOwner" data-id="${o.p.id}" aria-label="${esc(o.p.first)}: ${plural(o.cs.length, 'book')}">` +
    `<span class="pin-cover">${cover(o.cs[0].book)}${o.cs.length > 1 ? `<b>+${o.cs.length - 1}</b>` : ''}</span><span class="pin-name">${esc(o.p.first)}</span></button>`).join('');
  return `<div class="map-screen">
    <div class="map-top">
      <div class="pad search-row">${searchBar('map', 'People, books')}</div>
      <div class="rail chips-rail pad">${chips}<button type="button" class="pill${UI.mapAvailOnly ? ' on' : ''}" data-act="mapAvail" aria-pressed="${UI.mapAvailOnly}">${UI.mapAvailOnly ? icon('check') : ''}Available now</button></div>
      <p class="map-hint pad">${icon('pin', 'inline')} Just for fun: pins mark approximate areas, never home addresses.</p>
    </div>
    <div class="map-view" style="--z:${z}"><div class="map-world" style="transform:translate(${tx}%,${ty}%) scale(${z})">
      ${MAP_SVG}
      ${Object.entries(HOOD_LABELS).map(([k, [x, y]]) => `<span class="hood-label" style="left:${x}%;top:${y}%">${HOODS[k].name}</span>`).join('')}
      <span class="landmark" style="left:34%;top:91%">${icon('book', 'inline')} Town Library</span>
      ${selected ? `<span class="pin-area" style="left:${selected.p.x}%;top:${selected.p.y}%"></span>` : ''}
      <span class="me-dot" style="left:${PEOPLE.me.x}%;top:${PEOPLE.me.y}%"><i></i><span>You</span></span>
      ${pins}
    </div>
    <span class="map-count">${total ? `${plural(total, 'book')} from ${plural(owners.length, 'reader')}` : 'No books match'}</span>
    </div>
    ${selected ? mapSheet(selected) : ''}
  </div>`;
};

/* ---------- Messages ---------- */

function preview(c) {
  const m = lastMsg(c);
  if (!m) return 'No messages yet';
  if (m.kind === 'request') return `Borrow request · ${BOOKS[copyById(loanById(m.loan).copy).book].title}`;
  if (m.kind === 'system') return m.text;
  const who = m.from === 'me' ? 'You: ' : c.kind === 'group' ? `${PEOPLE[m.from].first}: ` : '';
  return who + m.text;
}

function convoCard(c) {
  const m = lastMsg(c);
  return `<button type="button" class="convo${c.unread ? ' unread' : ''}" data-act="openChat" data-id="${c.id}">
    ${c.kind === 'group' ? avatarStack(c.members, 52) : avatar(c.members[0], 52)}
    <span class="convo-text"><span class="convo-top"><strong>${esc(convoTitle(c))}</strong>${m ? `<time>${timeLabel(m.t)}</time>` : ''}</span>
      <span class="convo-preview">${esc(preview(c))}</span></span>

SCREENS.reading = () => {

};

/* ---------- Chat ---------- */

const LOAN_STATUS = { pending: ['pending', 'Request pending'], accepted: ['borrowed', 'Borrowed'], declined: ['unavailable', 'Declined'], returned: ['available', 'Returned'], cancelled: ['unavailable', 'Cancelled'] };

function loanCard(loanId) {
  const l = loanById(loanId);
  if (!l) return '';
  const c = copyById(l.copy);
  const b = BOOKS[c.book];
  const ownerIsMe = c.owner === 'me';
  const [code, label] = LOAN_STATUS[l.status];
  let actions = '';
  if (l.status === 'pending' && ownerIsMe) {
    actions = `<div class="btn-row"><button type="button" class="btn sm primary" data-act="respond" data-id="${l.id}" data-v="yes">Accept</button><button type="button" class="btn sm ghost" data-act="respond" data-id="${l.id}" data-v="no">Decline</button></div>`;
  } else if (l.status === 'pending') {
    const o = PEOPLE[c.owner].first;
    actions = `<div class="demo-box"><span>${icon('info', 'inline')} Demo control: there is no real ${esc(o)}, so play ${esc(o)}'s side.</span>
      <div class="btn-row"><button type="button" class="btn xs primary" data-act="respond" data-id="${l.id}" data-v="yes">Accept as ${esc(o)}</button><button type="button" class="btn xs ghost" data-act="respond" data-id="${l.id}" data-v="no">Decline as ${esc(o)}</button></div></div>
      <button type="button" class="link small" data-act="cancelRequest" data-id="${l.id}">Cancel my request</button>`;
  } else if (l.status === 'accepted') {
    actions = `<button type="button" class="btn sm ghost full" data-act="returned" data-id="${l.id}">${icon('check')} Mark as returned</button>`;
  }
  return `<div class="loan-card">
    <div class="lc-head"><span class="lc-label">Borrow request</span>${copyChip(code, label)}</div>
    <div class="lc-body"><button type="button" class="lc-cover" data-act="openBook" data-id="${c.book}" aria-label="Open ${esc(b.title)}">${cover(c.book)}</button>
      <dl><div><dt>Book</dt><dd>${esc(b.title)}</dd></div><div><dt>Owner</dt><dd>${esc(PEOPLE[c.owner].name)}</dd></div>
        <div><dt>Borrower</dt><dd>${esc(PEOPLE[l.borrower].name)}</dd></div><div><dt>Loan</dt><dd>${l.weeks} weeks${l.due && l.status === 'accepted' ? ` · ${esc(dueText(l.due))}` : ''}</dd></div>
        <div><dt>Pickup</dt><dd>${esc(PICKUPS[l.pickup])}</dd></div></dl>
      ${l.status === 'accepted' ? stamp(l.due) : ''}</div>
    ${actions}
  </div>`;
}

function dayLabel(ts) {
  const days = Math.round((startOfDay(new Date()) - startOfDay(new Date(ts))) / DAY);
  return days === 0 ? 'Today' : days === 1 ? 'Yesterday' : `${WEEKDAY[new Date(ts).getDay()]}, ${shortDate(ts)}`;
}

SCREENS.chat = ({ id }) => {
  const c = convoById(id);
  const group = c.kind === 'group';
  const sub = group ? c.members.map(m => PEOPLE[m].first).join(', ') + ' and you' : `${HOODS[PEOPLE[c.members[0]].hood].name}${isFriend(c.members[0]) ? ' · Friend' : ''}`;
  const head = `<button type="button" class="chat-head" ${group ? '' : `data-act="openPerson" data-id="${c.members[0]}"`}>${group ? avatarStack(c.members, 36) : avatar(c.members[0], 36)}
    <span><strong>${esc(convoTitle(c))}</strong><span>${esc(sub)}</span></span></button>`;
  let lastDay = '';
  const msgs = c.msgs.map(m => {
    const day = dayLabel(m.t);
    const sep = day !== lastDay ? `<div class="day-sep">${day}</div>` : '';
    lastDay = day;
    if (m.kind === 'system') return `${sep}<div class="sys">${icon('swap', 'inline')} ${esc(m.text)}</div>`;
    const mine = m.from === 'me';
    const bubble = m.text ? `<div class="bubble">${esc(m.text)}</div>` : '';
    return `${sep}<div class="msg${mine ? ' me' : ''}">${!mine && group ? avatar(m.from, 28) : ''}<div class="msg-col">
      ${!mine && group ? `<span class="msg-name">${esc(PEOPLE[m.from].first)}</span>` : ''}${bubble}${m.kind === 'request' ? loanCard(m.loan) : ''}
      <span class="msg-meta">${clockTime(m.t)}${m.sim ? ' · Sample reply' : ''}</span></div></div>`;
  }).join('');
  const typing = TYPING[id] ? `<div class="msg">${group ? avatar(TYPING[id], 28) : ''}<div class="msg-col"><div class="bubble typing" aria-label="${esc(PEOPLE[TYPING[id]].first)} is typing"><i></i><i></i><i></i></div></div></div>` : '';
  const draft = UI.drafts[id] || '';
  return `${topbar(head)}
  <div class="body has-topbar chat-body">${msgs || `<div class="empty small-empty"><p>Say hi to start the conversation.</p></div>`}${typing}</div>
  <div class="composer">
    <div class="composer-row"><label class="sr" for="composer">Message</label>
      <input id="composer" data-draft="${id}" type="text" placeholder="Message ${esc(group ? c.name : PEOPLE[c.members[0]].first)}" value="${esc(draft)}" autocomplete="off">
      <button type="button" class="send" data-act="send" data-id="${id}" aria-label="Send" ${draft.trim() ? '' : 'disabled'}>${icon('send')}</button></div>
    <p class="composer-note">Messages are private between you and your friend.</p>
  </div>`;
};

<script>
/* Shelfmates prototype: where book data comes from.
   1. Goodreads import: every Goodreads user can export their library as a CSV file
      (My Books > Import and export > Export library). The file is read in this browser; nothing is uploaded.
   2. Book database search: the full app would search Open Library (free, no key needed) or Google Books.
      This page tries Open Library live. Where the page can't reach other websites (the hosted preview),
      search falls back to the sample catalog and the sheet says so. */

/* ---------- Goodreads CSV import ---------- */

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') quoted = false;
      else field += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim()));
}

const normTitle = s => s.toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, ' ').trim();
function findBook(title, author) {
  const t = normTitle(title);
  const last = normTitle(author).split(' ').pop();
  const hit = Object.values(BOOKS).find(b => normTitle(b.title) === t && (!last || normTitle(b.author).includes(last)));
  return hit ? hit.id : null;
}
const GR_STATUS = { 'read': 'finished', 'currently-reading': 'reading', 'to-read': 'want' };

/* Returns { added, matched, shelves } or throws if the file isn't a Goodreads export. */
function importGoodreads(text) {
  const rows = parseCSV(text.replace(/^﻿/, ''));
  const head = (rows.shift() || []).map(h => h.trim());
  const col = name => head.indexOf(name);
  const iTitle = col('Title'), iAuthor = col('Author');
  if (iTitle < 0 || iAuthor < 0) throw new Error('not-goodreads');
  const iRating = col('My Rating'), iShelf = col('Exclusive Shelf'), iShelves = col('Bookshelves'), iAdded = col('Date Added');
  const iYear = col('Original Publication Year'), iYear2 = col('Year Published'), iOwned = col('Owned Copies');
  let added = 0, matched = 0;
  const newShelves = new Set();
  for (const r of rows.slice(0, 1000)) {
    const title = (r[iTitle] || '').replace(/\s*\([^()]*#[\d.]+\)\s*$/, '').trim(); // drop "(Series, #1)"
    if (!title) continue;
    const author = (r[iAuthor] || '').trim();
    let id = findBook(title, author);
    if (id) matched++;
    else {
      id = addCustomBook(title, author, { year: +r[iYear] || +r[iYear2] || null, genre: 'From Goodreads', desc: 'Imported from your Goodreads library. In the full app, the description and cover would come from a book database.' });
      added++;
    }
    const e = ensureEntry(id);
    const shelf = (r[iShelf] || '').trim();
    e.status = GR_STATUS[shelf] || e.status || null;
    const rating = parseInt(r[iRating], 10);
    if (rating > 0) e.rating = Math.min(5, rating);
    const when = Date.parse((r[iAdded] || '').trim().replace(/\//g, '-'));
    if (when) e.added = when;
    for (const raw of (r[iShelves] || '').split(',').map(s => s.trim()).filter(Boolean)) {
      if (GR_STATUS[raw]) continue;
      if (/^favou?rites?$/i.test(raw)) { e.fav = true; continue; }
      const name = raw.replace(/[-_]+/g, ' ').replace(/\b\w/g, ch => ch.toUpperCase());
      let s = S.shelves.find(x => x.name.toLowerCase() === name.toLowerCase());
      if (!s) {
        const newId = createShelf(name);
        s = S.shelves.find(x => x.id === newId);
        newShelves.add(name);
      }
      if (!e.shelves.includes(s.id)) e.shelves.push(s.id);
    }
    if (parseInt(r[iOwned], 10) > 0) addMyCopy(id, false);
  }
  if (!added && !matched) throw new Error('empty');
  return { added, matched, shelves: newShelves.size };
}

/* ---------- Book database search (Open Library) ---------- */

const BOOKDB = { live: null, q: '', results: [], loading: false }; // live: null = not tried, true = reachable, false = blocked
let bookdbTimer = 0;

function searchBookDb(q) {
  clearTimeout(bookdbTimer);
  q = q.trim();
  if (BOOKDB.live === false || q.length < 3) { BOOKDB.loading = false; return; }
  BOOKDB.loading = true;
  bookdbTimer = setTimeout(async () => {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 6000);
    try {
      const url = `https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=8&fields=key,title,author_name,first_publish_year,cover_i`;
      const res = await fetch(url, { signal: ctrl.signal });
      if (!res.ok) throw new Error(String(res.status));
      const data = await res.json();
      BOOKDB.live = true;
      BOOKDB.q = q;
      BOOKDB.results = (data.docs || []).filter(d => d.title).map(d => ({
        key: d.key, title: d.title, author: (d.author_name || [])[0] || 'Unknown author', year: d.first_publish_year || null, cover: d.cover_i || null,
      }));
    } catch (err) {
      BOOKDB.live = false; // blocked or offline: stop trying for this visit
      BOOKDB.results = [];
    }
    clearTimeout(timer);
    BOOKDB.loading = false;
    if (UI.sheet && UI.sheet.type === 'addBook') render();
  }, 450);
}

/* Open Library results that aren't already in the app's catalog. */
function bookDbResults(q) {
  if (BOOKDB.q !== q.trim()) return [];
  return BOOKDB.results.filter(r => !findBook(r.title, r.author));
}

ACT.addBookPickOL = d => {
  const r = BOOKDB.results.find(x => x.key === d.key);
  if (!r) return;
  const id = findBook(r.title, r.author) || addCustomBook(r.title, r.author, {
    year: r.year, genre: 'From Open Library', desc: 'Details from Open Library. In the full app the description and cover would load from the database too.',
  });
  UI.sheet.pick = id;
  UI.sheet.own = !!myCopy(id);
  render();
};

ACT.searchDb = () => {
  const q = UI.q.home;
  openSheet({ type: 'addBook', q, pick: null, status: 'want', own: false, lend: false, shelves: [], manual: false, title: '', author: '' });
  searchBookDb(q);
};

<script>
/* Shelfmates prototype: accounts. Sign up, log in, profile, settings, log out.
   Saved in this browser only (localStorage, separate from the demo data). Not real security:
   please don't use a real password. */

const ACCT_KEY = 'shelfmates-account-v1';
const pwHash = s => { let h = 5381; for (const c of s) h = (h * 33 ^ c.charCodeAt(0)) >>> 0; return h.toString(36); };
let A = (() => { try { return JSON.parse(localStorage.getItem(ACCT_KEY)); } catch (e) { return null; } })() || { user: null, in: false };
const saveA = () => { try { localStorage.setItem(ACCT_KEY, JSON.stringify(A)); } catch (e) { /* keep going in memory */ } };
const AUTH = { mode: 'login', name: '', email: '', pass: '', err: '' };
const AV_COLORS = ['#1f5a41', '#b65a3a', '#2f5d8a', '#8a3b6e', '#a8761f', '#3e7c6b'];
const DEF_PREFS = { notify: true, lendDefault: false, showOnMap: true, findable: true };
const ME0 = Object.assign({}, PEOPLE.me);

/* Push the account's profile into the "me" person the rest of the app already uses. */
function applyProfile() {
  const u = A.user, me = PEOPLE.me;
  if (!A.in || !u) { Object.assign(me, ME0); me.first = me.name.split(' ')[0]; return; }
  const h = HOODS[u.hood] || HOODS.maple;
  Object.assign(me, { name: u.name, first: u.name.split(' ')[0], bio: u.bio, hood: u.hood, color: u.color, x: h.x + 1, y: h.y + 7 });
}
applyProfile();

function acctError(msg) { AUTH.err = msg; render(); }

const ACCT = {
  authMode: d => { AUTH.mode = d.id; AUTH.err = ''; render(); },
  authSubmit: () => {
    const name = AUTH.name.trim(), email = AUTH.email.trim().toLowerCase(), pass = AUTH.pass;
    if (!/^\S+@\S+\.\S+$/.test(email)) return acctError('Enter a valid email address.');
    if (AUTH.mode === 'signup') {
      if (!name) return acctError('Add your name so neighbors know who you are.');
      if (pass.length < 6) return acctError('Use at least 6 characters for the password.');
      A = { in: true, user: { name, email, pw: pwHash(pass), bio: '', hood: 'maple', color: AV_COLORS[0], prefs: Object.assign({}, DEF_PREFS), joined: Date.now() } };
    } else {
      if (!A.user || A.user.email !== email || A.user.pw !== pwHash(pass)) return acctError('That email and password don\'t match an account on this device.');
      A.in = true;
    }
    Object.assign(AUTH, { pass: '', err: '' });
    saveA(); applyProfile(); enterApp(AUTH.mode === 'signup' ? `Welcome to Shelfmates, ${PEOPLE.me.first}!` : `Welcome back, ${PEOPLE.me.first}`);
  },
  authDemo: () => { A = { in: true, user: null }; saveA(); applyProfile(); enterApp('Signed in as the demo account'); },
  logout: () => { A.in = false; saveA(); applyProfile(); UI.sheet = null; hideToast(); AUTH.mode = A.user ? 'login' : 'signup'; AUTH.email = A.user ? A.user.email : ''; render(); },
  deleteAccount: () => {
    A = { user: null, in: false }; saveA(); resetDemo(); applyProfile(); UI.sheet = null;
    Object.assign(UI, { tab: 'home', stacks: freshStacks() }); AUTH.mode = 'signup'; AUTH.email = AUTH.name = ''; render();
  },
  editProfile: () => { const u = A.user; openSheet({ type: 'editProfile', name: u.name, bio: u.bio, hood: u.hood, color: u.color }); },
  saveProfile: () => {
    const sh = UI.sheet, name = (sh.name || '').trim();
    if (!name) { toast('Your name can\'t be empty'); return; }
    Object.assign(A.user, { name, bio: (sh.bio || '').trim(), hood: sh.hood, color: sh.color });
    UI.sheet = null; saveA(); applyProfile(); done('Profile updated');
  },
  pref: d => {
    if (!A.user) { toast('Create an account to save settings'); return; }
    A.user.prefs[d.id] = !A.user.prefs[d.id]; saveA(); render();
  },
  account: () => go('account'),
};
Object.assign(ACT, ACCT);

function enterApp(msg) {
  Object.assign(UI, { tab: 'home', stacks: freshStacks(), sheet: null });
  UI.anim = 'fade'; render(); if (msg) toast(msg);
}

<script>
/* Real book covers. Looks each book up once on Open Library, then Google Books, remembers the result,
   and falls back to the drawn cover. */
(() => {
const KEY = 'shelfmates-covers-v1';
let known = {}; try { known = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { /* none yet */ }
const olUrl = id => `https://covers.openlibrary.org/b/id/${id}-M.jpg?default=false`;
const urlOf = k => (!k ? null : typeof k === 'string' ? k : olUrl(k));
const gfix = u => u.replace('http://', 'https://').replace('&edge=curl', '');
const imgTag = u => `<img class="cover-img" src="${esc(u)}" alt="" loading="lazy" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2">`;
const asked = new Set(), queue = []; let busy = false, offline = false, gOff = false;
const enc = encodeURIComponent;

async function run() {
  if (busy) return; busy = true;
  while (queue.length && !offline) {
    const id = queue.shift(), b = BOOKS[id]; if (!b) continue;
    let found = null, undecided = false;
    try {
      const res = await fetch(`https://openlibrary.org/search.json?title=${enc(b.title)}&author=${enc(b.author)}&limit=1&fields=cover_i`);
      if (!res.ok) throw new Error('bad');
      const d = await res.json(); found = d.docs && d.docs[0] && d.docs[0].cover_i || null;
    } catch (e) { offline = true; break; }
    if (!found && !gOff) {
      try {
        const gr = await fetch(`https://www.googleapis.com/books/v1/volumes?q=intitle:${enc('"' + b.title + '"')}+inauthor:${enc('"' + b.author + '"')}&maxResults=1&fields=items(volumeInfo/imageLinks)`);
        if (!gr.ok) throw new Error('bad');
        const gd = await gr.json(), il = gd.items && gd.items[0] && gd.items[0].volumeInfo && gd.items[0].volumeInfo.imageLinks;
        if (il && (il.thumbnail || il.smallThumbnail)) found = gfix(il.thumbnail || il.smallThumbnail);
      } catch (e) { gOff = true; undecided = true; }
    } else if (!found && gOff) undecided = true;
    if (!undecided) { known[id] = found || 0; try { localStorage.setItem(KEY, JSON.stringify(known)); } catch (e) { /* ignore */ } }
    if (found) document.querySelectorAll(`[data-bid="${id}"]`).forEach(el => { if (!el.querySelector('.cover-img')) el.insertAdjacentHTML('afterbegin', imgTag(urlOf(found))); });
    await new Promise(r => setTimeout(r, 300));
  }
  busy = false;
}

const coverBase = cover;

<script>
/* Full book search across Open Library and Google Books (no key needed), with covers and descriptions. */
(() => {
const enc = encodeURIComponent, norm = s => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const gfix = u => u.replace('http://', 'https://').replace('&edge=curl', '');
let latest = '';

searchBookDb = function (q) {
  clearTimeout(bookdbTimer);
  q = q.trim(); latest = q;
  if (BOOKDB.live === false || q.length < 3) { BOOKDB.loading = false; return; }
  BOOKDB.loading = true;
  bookdbTimer = setTimeout(async () => {
    const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 6000), opt = { signal: ctrl.signal };
    const ol = fetch(`https://openlibrary.org/search.json?q=${enc(q)}&limit=8&fields=key,title,author_name,first_publish_year,cover_i`, opt)
      .then(r => { if (!r.ok) throw new Error('bad'); return r.json(); })
      .then(d => (d.docs || []).filter(x => x.title).map(x => ({ key: x.key, title: x.title, author: (x.author_name || [])[0] || 'Unknown author', year: x.first_publish_year || null, cover: x.cover_i || null, src: 'Open Library' })))
      .catch(() => null);
    const gb = fetch(`https://www.googleapis.com/books/v1/volumes?q=${enc(q)}&maxResults=8&printType=books&fields=items(id,volumeInfo(title,authors,publishedDate,description,imageLinks))`, opt)
      .then(r => { if (!r.ok) throw new Error('bad'); return r.json(); })
      .then(d => (d.items || []).filter(i => i.volumeInfo && i.volumeInfo.title).map(i => {
        const v = i.volumeInfo, il = v.imageLinks, desc = (v.description || '').replace(/<[^>]*>/g, '').trim();
        return { key: 'g:' + i.id, title: v.title, author: (v.authors || [])[0] || 'Unknown author', year: parseInt(v.publishedDate, 10) || null,
          desc: desc.length > 300 ? desc.slice(0, 297).trimEnd() + '...' : desc, coverUrl: il && (il.thumbnail || il.smallThumbnail) ? gfix(il.thumbnail || il.smallThumbnail) : null, src: 'Google Books' };
      }))
      .catch(() => null);
    const [a, g] = await Promise.all([ol, gb]);
    clearTimeout(timer);
    if (q !== latest) return;
    if (a === null && g === null) { BOOKDB.live = false; BOOKDB.results = []; }
    else {
      BOOKDB.live = true; BOOKDB.q = q;
      const out = [], seen = new Map(), A = a || [], G = g || [];
      for (let i = 0; i < Math.max(A.length, G.length) && out.length < 10; i++) {
        [A[i], G[i]].forEach(r => {
          if (!r) return;
          const k = norm(r.title) + norm(r.author), prev = seen.get(k);
          if (prev) { prev.coverUrl = prev.coverUrl || r.coverUrl; prev.cover = prev.cover || r.cover; prev.desc = prev.desc || r.desc; prev.year = prev.year || r.year; }
          else if (out.length < 10) { seen.set(k, r); out.push(r); }
        });
      }
      BOOKDB.results = out;
    }
    BOOKDB.loading = false;
    if (UI.sheet && UI.sheet.type === 'addBook') render();
    else if (!UI.sheet && cur().s === 'home' && UI.q.home.trim() === q) render();
  }, 450);
};
})();

</script>
